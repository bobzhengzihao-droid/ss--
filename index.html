            '严厉': '你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位对孩子有明确要求、说话不绕弯子的老师。沟通风格严肃但不失礼貌，直接但不冒犯。出发点是"把问题说清楚，请家长配合解决"，不粉饰、不打折扣。\n2. 语言分寸感：语气干脆、直接，少用"哈、嘛、呀"这类语气词，可保留🙏表示尊重。措辞明确不含糊，该说"必须完成"就说"必须完成"，该说"需要重视"就说"需要重视"。不替孩子找借口，不帮家长打圆场。\n3. 逻辑结构：优点简单带过，重点放在需要改进的问题上。开场随机变换："情况直接说""今天的反馈比较直接""不绕弯子，直接说重点""有几个问题需要正视""我不兜圈子了"。逐条说清问题、为什么重要、家长需要做什么。从优点切入问题时随机变换："好的方面就不多说了，直接说问题""简单说两句好的，重点在后面""先说句好的，然后进入正题"。问题之间用"另外""还有一件事""再说一个"串联。收尾随机变换："请务必落实""下次课我会检查""这件事不能再拖了""请这周内给我反馈""希望下次课能看到改善"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。问题就直接说问题，不用"成长空间""提升空间"这类词包装。\n5. 整体观感：读起来让家长感受到"老师是认真的，这事得重视"，有适度紧迫感但不是发脾气，而是负责任地敲警钟。',
            '幽默': '你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位幽默、有亲和力的老师，善于用轻松的方式把严肃的事说明白。风格是"把话说软，把事办好"，让家长会心一笑中接收到信息，不板着脸说教。\n2. 语言分寸感：适度用"哈哈""哎呀"等轻松语气词和😅😂🙈等表情营造轻松感，但点到为止，不能让家长觉得你在拿孩子的问题开玩笑。措辞可以用形象有趣的表达化解尴尬，比如字迹潦草说"字写得像在跳舞"，作业没做说"作业还在放假中"。提要求用"咱们悄悄使把劲""这个技能得点亮一下"这类好玩的说法。关键是：幽默包装建议，不是嘲讽孩子。对孩子的态度始终是善意的。\n3. 逻辑结构：先用轻松方式说好的方面。开场随机变换："来，给您播报一下今天的战况""前方发来课堂快报""今天的表现报告来了""今日份观察日记请查收""叮！您有一条课堂速递"。用"不过嘛""还有个事儿得唠叨一句""好的说完了，来个小小的但是""接下来是温馨提示时间""说完开心的，再说个需要一起加油的"俏皮转折。收尾随机变换："行嘞，回去盯一盯哈""好了我念叨完了，辛苦辛苦""下课！回家记得检查哦""今天先这样，明天继续战斗""拜拜，记得看群通知"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。幽默是调味料，信息本身不能打折，该说的问题还是要说到位。\n5. 整体观感：读起来像一位性格开朗的老师，课间用轻松口吻跟家长吐个槽又加个油。家长读完觉得"这老师挺逗的，回去我盯盯孩子"。',
            '文艺': '你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位有书卷气、心思细腻的老师，善于用温润的文字传递教育的温度。表达不急不躁，像傍晚灯下写一封短笺，让家长读完心里柔软一下，又清楚该往哪里使劲。\n2. 语言分寸感：用词可以偏雅致一些但不要晦涩，毕竟还是老师在微信上说话。可以适当用比喻让表达更生动，比如把进步比作"抽枝展叶"、粗心比作"小石子绊了脚"。节奏舒缓，句子可以稍长但读起来要流畅。慎用网络语气词，表情用 🍃✨📝 这类安静的就好。文艺是形式不是目的，内核仍然是清晰的老师口吻，只是把"你要怎样"换成"我们一起等一等他""这块土壤再松松土"。\n3. 逻辑结构：先铺温暖底色。开场随机变换："今日课堂，跟您聊聊这孩子""傍晚了，跟您说说今天的模样""这些细小的事，想讲给您听""课后写几句，关于今天的样子""今天的他，像一页正在展开的书"。需要改进处轻轻放入，像翻到折了角的一页。从表扬过渡到提醒时随机变换："不过有一个小细节想轻轻提一下""另外有件小事，跟您说说""还有一页，翻过去看看""顺带提一句""说完了好的，再轻轻说一句需要留意的"。收尾随机变换："愿他慢慢长，稳稳走""我们一起等等他""夜安，慢慢来""每朵花都有自己的花期""期待他下一次的表现"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。用意象和比喻去包装，但信息本身不能模糊，家长读完要知道具体问题是什么、该怎么配合。\n5. 整体观感：读起来不像工作消息，更像一段教育随笔。让家长觉得"这位老师心里装着孩子"，从而更愿意信任和配合。',
            '学术': '你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位兼具教学实践与理论素养的专家型教师。表达精准、克制，每一句反馈背后都有专业判断做支撑。不煽情、不套近乎，靠专业洞察本身建立信任。距离感也是一种尊重。\n2. 语言分寸感：用词追求准确而非华丽。可适当用教育心理学、语言学等术语精准定位问题，比如"语音意识薄弱""表达准确率不稳定""书写规范性不足"。术语后面要跟一句通俗解释，避免显得在拽词。慎用语气词和表情，可偶尔用🙏表示尊重。\n3. 逻辑结构：现象描述→专业判断→具体建议。先说观察到的表现，再给出专业解读，最后落到具体行动上。开场随机变换："今天跟您反馈一下学习情况""今日课堂观察，跟您聊聊""今天的学情，跟您说说""课后整理了今天的要点""今天的表现，我的判断是这样的"。从数据过渡到评语时随机变换："综合来看""我的判断是""这说明""反映出""值得注意的趋势是"。收尾随机变换："以上为今天的情况汇总""保持关注，定期跟您更新""有疑问随时跟我交流""下次课我会对照验证""我会在后续课堂中持续观察"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。可以适度提炼更深一层的观察让反馈更有洞察力，但不能凭空捏造没提供的事实。\n5. 整体观感：读起来像一位学者型老师在课后用几分钟写的教学札记。家长读完觉得"问题清楚了，路径也有了，老师是懂的"，产生深度信任。',
            '安抚': '你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位温柔、沉稳、像清风一样让人安心的老师。你深知教育急不得，每个孩子都有自己的成长节奏。你传递信息的方式，能让家长紧绷的肩膀放松下来，相信"慢慢来，都会好的"。\n2. 语言分寸感：语速感要慢，用词要轻。多用"没关系""很正常""咱们慢慢来""不急的"这类消解焦虑的表达。不说"有问题""不好""落后"，换成"还在路上""还在适应中""暂时还不够稳当"。表情用😊🌿🌸这类温和的符号，不堆砌。语气词"呀""呢"用得像微风拂过水面，浅浅一下。\n3. 逻辑结构：从温暖瞬间或微小进步说起。开场随机变换："跟您轻轻说一下今天的情况""今天想跟您聊聊，一切都在正常轨道上""整体表现平稳，跟您说说细节""今天的小记录，您看看就好""关于今天，跟您聊几句，不着急的"。改进处包装成成长中正常的一小步，从好的过渡到需留意的随机变换："另外有个小小的观察""还有一件小事想轻轻提一下""顺带说一句，不用紧张""说完好的，再轻轻提一个地方"。收尾随机变换："我在呢，放心""没事的，我一直在关注他""您不用额外做什么，陪着就好""心安，一切都在变好""有我在课堂盯着，您放心"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。措辞裹上一层柔光滤镜，该说的事一件不落，但每一件都让人听了不着急。\n5. 整体观感：读起来像一阵初夏傍晚的微风，轻柔地吹进家长心里。家长读完觉得"孩子没事，老师挺用心的，我也不用那么紧绷"，焦虑被轻轻化解了。',
            '阳光': '你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位像小太阳一样的老师，浑身正能量。每条消息都带着温度和活力，让家长读完嘴角不自觉上扬。你相信每个孩子都是闪光的小星星，你的任务就是帮他们擦亮光芒。\n2. 语言分寸感：用词明亮轻快有节奏感。多用短句，像跳动的音符。善用叠词制造活泼感，比如"稳稳的""溜溜的""叮咚，有个小提醒"。表情大方使用☀️🌟🎉👏✨这类亮闪闪的符号。语气词"哦""哟""啦"轻盈上扬。夸孩子要具体又生动，比如"今天举手的速度快得像弹簧"，提问题说完立刻接上积极方案，不给家长留焦虑空间。\n3. 逻辑结构：先放好消息点燃气氛。开场随机变换："今天又有好消息啦""叮咚！进步快报来了""快看！今天超级棒""充满活力的一天，表现报告""嘿嘿，今天可厉害了"。用"不过呀""小小声说一句""还有一件小事""对了，差点忘了说"调皮切入，立刻接"咱们一起就能搞定"。收尾随机变换："一起加油呀""明天继续保持这股劲""太期待下次课了""加油加油，看好他""咱们把这种状态保持住"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。每个问题后面跟上正向行动建议，不能只把问题丢出去。\n5. 整体观感：读起来像一段元气满满的语音留言，让人听了想立刻行动、充满干劲。家长读完觉得"老师都这么有能量，我不好意思不配合"，心情愉快轻松。',
            '警醒': '你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位有原则有底线的老师。平时好说话，但触及学习态度和习惯问题时绝不含糊。这一次你不是在商量，而是在通知——问题已经到了需要正视的时候。语气里有适度的压迫感，让家长读完心里一紧，意识到"老师这次是动真格的了"。\n2. 语言分寸感：句子要短，节奏要硬。少修饰，少铺垫，直接说事。不用任何软化的语气词，也不用表情。整条消息可以一个表情都没有——冷下来才有力道。用词精准有分量，多用"必须""不能再""我不希望再看到"这类边界感明确的表达。注意：是敲山震虎，不是出口伤人。批评的靶心是行为和现象，不是人格。\n3. 逻辑结构：开门见山直指核心问题，优点一笔带过甚至不提。开场句式要随机变换，不要每次都用同一种说法。可参考以下变体："今天我要严肃地说一件事""有个情况我得直说了""这次的反馈不太轻松""我直接切入正题""有件事需要你这边重视一下""我想认真跟你同步一个问题"。逐条列出问题，每个问题后面跟明确行动指令或底线要求。结尾要变换着落在不同力度的督促上，比如"请务必配合抓紧落实""下次课我会检查""这个问题不能再拖了""希望这周内能看到变化"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。问题摊开揉碎说，可以用"反复出现""一直没有解决"强调持续性。\n5. 整体观感：读起来像一份简短的口头警告。没有寒暄，没有迂回，每句话都踩在点上。家长读完觉得"老师这次是真急了，我得马上行动"，而不是"哦，老师又说了一遍"。',
            '表扬': '你是少儿英语培训老师，今天只做一件事：给孩子报喜。\n\n风格要求：\n1. 角色与气场：今天的你是一只专门报喜的喜鹊。放下"诊断者"角色，纯粹做一个"发现者"——发现孩子身上微小但闪光的进步，郑重地告诉家长。消息像一束阳光照进家长手机屏幕，让他们心头一暖、嘴角一扬。\n2. 语言分寸感：只说好事，不提任何问题。哪怕草稿里有需要改进的地方，本轮一概忽略。夸得要具体生动，把进步放在时间轴上看——"比之前稳了不少""正确率在往上走"。语气比平时更上扬，适度用🌟👏🎉☀️等表情。用"太棒了""进步明显""看到他在悄悄努力"这类有感染力的表达。\n3. 逻辑结构：开篇定调来报喜。开场随机变换："今天专门来报喜""好消息！关于他的""又进步了，必须告诉您""特大喜讯——今日捷报""开心的事要跟您分享"。用两到三个亮点展开，每个"具体表现+背后意义"。收尾随机变换："孩子的成长离不开您的配合，这份进步也有您的功劳""感谢您的用心陪伴""一起为他鼓掌""这就是坚持的力量""每一次进步，都是我们共同努力的结果"。\n4. 信息处理：只提取草稿中积极正面的信息点。任何需要改进、尚未完成的事项，本次一概不提。如果正面信息点较少，可以在不虚构事实的前提下延伸对孩子的观察和期待。正面信息严重不足时，简要表达"今天整体表现不错，继续加油"即可，不硬凑。\n5. 整体观感：读起来像一张精致的"成长小卡片"。家长读完不会觉得有负担，只会觉得"孩子在老师眼里是会发光的"，大概率截图转发给家人一起开心。',

        function toggleTagByCheckbox(cb) {
            const student = currentCommunicationStudent;
            if (!student) return;
            if (!selectedTags[student]) selectedTags[student] = {};
            const tagId = cb.value;
            if (cb.checked) {
                selectedTags[student][tagId] = true;
            } else {
                delete selectedTags[student][tagId];
            }
            renderTagList();
            renderTagScenes();
            updateTagCapsules();
            generateCommunicationText();
        }

        function selectCommunicationStudent(name) {

        }

        function onCommClassChange(classId) {
            currentClassId = classId;
            const dates = getDateList();
            const savedDate = localStorage.getItem('_fb_last_date_' + classId);
            currentDateLabel = (savedDate && dates.includes(savedDate)) ? savedDate : (dates.length ? dates[0] : 'Day1');
            const cls = getCurrentClass();
            currentCommunicationStudent = (cls && cls.students && cls.students.length) ? cls.students[0] : null;
            // 清除旧班级的所有学生状态（避免同名泄露和内存堆积）
            selectedTags = {};
            selectedDataCols = {};
            commPeriodDates = [];
            updateCurrentClassDisplay();
            renderCommunicationView();
        }

        function onCommDateChange(dateStr) {
            currentDateLabel = dateStr;
            localStorage.setItem('_fb_last_date_' + currentClassId, dateStr);
            renderCommunicationView();
        }

        function onCommModeChange(mode) {
            commMode = mode;
            localStorage.setItem('_fb_comm_mode', mode);
            dbSet('commMode', mode);
            if (mode === 'periodic') {
                const validDates = getDateList();
                commPeriodDates = commPeriodDates.filter(function(d) { return validDates.includes(d); });
                if (!commPeriodDates.length) {
                    commPeriodDates = validDates.slice();
                }
                localStorage.setItem('_fb_comm_period_dates', JSON.stringify(commPeriodDates));
                dbSet('commPeriodDates', commPeriodDates);
            }
            renderCommunicationView();
        }

        function onPeriodDateToggle(cb) {
            if (cb.checked) {
                if (!commPeriodDates.includes(cb.value)) commPeriodDates.push(cb.value);
            } else {
                commPeriodDates = commPeriodDates.filter(function(d) { return d !== cb.value; });
            }
            localStorage.setItem('_fb_comm_period_dates', JSON.stringify(commPeriodDates));
            dbSet('commPeriodDates', commPeriodDates);
            generateCommunicationText();
            if (commMode === 'periodic') renderDataCheckboxes();
        }

            renderCommunicationView();

        function addScene() {
            const container = document.getElementById('sceneActions');
            if (!container || container.querySelector('.scene-add-input')) return;
            const plusBtn = container.querySelector('button[onclick="addScene()"]');
            const input = document.createElement('input');
            input.className = 'scene-add-input';
            input.placeholder = '新分类名称';
            input.style.cssText = 'font-size:12px;padding:4px 8px;border:1px solid var(--accent);border-radius:var(--btn-radius);outline:none;width:100px;';
            if (plusBtn) plusBtn.replaceWith(input);
            input.focus();
            const commit = function() {
                const raw = input.value.trim();
                if (raw) {
                    const emojiMatch = raw.match(/^(\p{Emoji})/u);
                    const icon = emojiMatch ? emojiMatch[1] : '💬';
                    const name = emojiMatch ? raw.slice(emojiMatch[0].length).trim() || raw : raw;
                    const key = 'custom_' + Date.now();
                    customScenes[key] = true;
                    communicationTags[key] = { name: name, icon: icon, tags: [] };
                    saveCustomScenes();
                    currentTagCategory = key;
                    sceneEditMode = false;
                }
                setTimeout(function() {
                    renderTagScenes();
                    renderTagList();
                    updateTagCapsules();
                }, 100);
            };
            const onSceneAddBlur = function() { input.removeEventListener('blur', onSceneAddBlur); commit(); };
            input.addEventListener('blur', onSceneAddBlur);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { input.value = ''; input.blur(); }
            });
        }

        function deleteScene(key) {
            const btn = document.querySelector('.tag-scene-tab[data-scene="' + key + '"]');
            if (btn && !btn._deleting) {
                btn._deleting = true;
                btn.classList.add('shaking');
                setTimeout(function() { _finishDeleteScene(key); }, 400);
            } else if (!btn) {
                _finishDeleteScene(key);
            }
        }

        function _finishDeleteScene(key) {
            if (customScenes[key]) {
                delete customScenes[key];
                delete communicationTags[key];
                saveCustomScenes();
            } else {
                deletedPresetScenes.push(key);
                delete communicationTags[key];
                try { localStorage.setItem('_fb_deleted_scenes', JSON.stringify(deletedPresetScenes)); } catch(e) {}
                dbSet('commDeletedScenes', deletedPresetScenes);
            }
            if (currentTagCategory === key) {
                const scenes = Object.keys(communicationTags);
                currentTagCategory = scenes.length ? scenes[0] : 'classroom';
            }
            renderTagScenes();
            renderTagList();
            updateTagCapsules();
            generateCommunicationText();
        }

        function startEditScene(key) {
            const sceneData = communicationTags[key];
            if (!sceneData) return;
            const btn = document.querySelector('.tag-scene-tab[data-scene="' + key + '"]');
            if (!btn || btn._editing) return;
            btn._editing = true;
            const origOnclick = btn.getAttribute('onclick');
            btn.removeAttribute('onclick');
            const input = document.createElement('input');
            input.type = 'text';
            input.value = sceneData.name;
            input.style.cssText = 'font-size:12px;padding:2px 6px;border:1px solid var(--accent);border-radius:6px;outline:none;width:' + Math.max(60, sceneData.name.length * 17 + 20) + 'px;max-width:120px;background:white;';
            btn.innerHTML = '';
            btn.appendChild(input);
            setTimeout(function() { input.focus(); input.select(); }, 50);
            const done = function() {
                btn._editing = false;
                btn.setAttribute('onclick', origOnclick);
                const raw = input.value.trim();
                if (raw && raw !== sceneData.name) {
                    const emojiMatch = raw.match(/^(\p{Emoji})/u);
                    if (emojiMatch) { sceneData.icon = emojiMatch[1]; sceneData.name = raw.slice(emojiMatch[0].length).trim() || raw; }
                    else { sceneData.name = raw; }
                    if (!customScenes[key]) { customScenes[key] = true; }
                    saveCustomScenes();
                }
                renderTagScenes();
            };
            const onSceneBlur = function() { input.removeEventListener('blur', onSceneBlur); done(); };
            input.addEventListener('blur', onSceneBlur);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { input.value = sceneData.name; input.blur(); }
            });
        }

            try { localStorage.setItem('_fb_custom_scenes', JSON.stringify(customScenes)); } catch(e) {}

                    if (saved) data = JSON.parse(saved);

        function addCustomTag() {
            const input = document.getElementById('customTagInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            const cat = currentTagCategory;
            if (!communicationTags[cat]) return;
            // 如果开头有 emoji，提取出来，文字部分去掉
            let emoji = '';
            let displayText = text;
            const emojiMatch = text.match(/^(\p{Emoji})/u);
            if (emojiMatch) { emoji = emojiMatch[1]; displayText = text.slice(emojiMatch[0].length).trim(); }
            const id = 'x' + Date.now();
            const newTag = { id: id, text: displayText, emoji: emoji, pos: 0, custom: true };
            communicationTags[cat].tags.push(newTag);
            input.value = '';
            saveCustomTags();
            renderTagList();
            renderTagScenes();
            updateTagCapsules();
            generateCommunicationText();

        function deleteTag(tagId) {
            // 先找 DOM 元素播动画
            const tagEl = document.querySelector('.tag-item[data-tag-id="' + tagId + '"]');
            if (tagEl) {
                tagEl.classList.add('removing');
                setTimeout(function() {
                    _finishDeleteTag(tagId);
                }, 450);
            } else {
                _finishDeleteTag(tagId);
            }
        }

        function _finishDeleteTag(tagId) {
            // 判断是预置还是自定义
            let isPreset = false;
            Object.keys(communicationTags).forEach(function(cat) {
                communicationTags[cat].tags.forEach(function(t) {
                    if (t.id === tagId && !t.custom) isPreset = true;
                });
            });
            if (isPreset) {
                deletedPresetTags.push(tagId);
                saveDeletedPresets();
                Object.keys(communicationTags).forEach(function(cat) {
                    communicationTags[cat].tags = communicationTags[cat].tags.filter(function(t) { return t.id !== tagId; });
                });
            } else {
                Object.keys(communicationTags).forEach(function(cat) {
                    communicationTags[cat].tags = communicationTags[cat].tags.filter(function(t) { return t.id !== tagId; });
                });
                saveCustomTags();
            }
            const student = currentCommunicationStudent;
            if (selectedTags[student]) delete selectedTags[student][tagId];
            renderTagList();
            renderTagScenes();
            updateTagCapsules();
            generateCommunicationText();
        }

            const customTags = {};
            Object.keys(communicationTags).forEach(function(cat) {
                customTags[cat] = communicationTags[cat].tags.filter(function(t) { return t.custom; });

            try { localStorage.setItem('_fb_custom_tags', JSON.stringify(customTags)); } catch(e) {}
            dbSet('commCustomTags', customTags);

        async function loadCustomTags() {
            try {
                // 优先从 Supabase 加载
                let customTags = null, deletedPresets = null;
                const cloudCustom = await dbGet('commCustomTags');
                const cloudDeleted = await dbGet('commDeletedPresets');
                if (cloudCustom) customTags = cloudCustom;
                if (cloudDeleted) deletedPresets = cloudDeleted;
                // fallback localStorage
                if (!customTags) {
                    const saved = localStorage.getItem('_fb_custom_tags');
                    if (saved) customTags = JSON.parse(saved);
                }
                if (!deletedPresets) {
                    const saved = localStorage.getItem('_fb_deleted_presets');
                    if (saved) deletedPresets = JSON.parse(saved);
                }
                if (customTags) {
                    Object.keys(customTags).forEach(function(cat) {
                        if (communicationTags[cat]) {
                            customTags[cat].forEach(function(t) { communicationTags[cat].tags.push(t); });
                        }
                    });
                }
                if (deletedPresets) {
                    deletedPresetTags = deletedPresets;
                    Object.keys(communicationTags).forEach(function(cat) {
                        communicationTags[cat].tags = communicationTags[cat].tags.filter(function(t) {
                            return t.custom || !deletedPresetTags.includes(t.id);
                        });
                    });
                }
                // 加载编辑过的预置标签
                let cloudEdited = await dbGet('commEditedPresets');
                if (!cloudEdited) {
                    const saved = localStorage.getItem('_fb_edited_presets');
                    if (saved) cloudEdited = JSON.parse(saved);
                }
                if (cloudEdited) {
                    editedPresets = cloudEdited;
                    Object.keys(editedPresets).forEach(function(tagId) {
                        if (editedPresets[tagId].text) {
                            Object.keys(communicationTags).forEach(function(cat) {
                                communicationTags[cat].tags.forEach(function(t) {
                                    if (t.id === tagId) t.text = editedPresets[tagId].text;
                                });
                            });
                        }
                    });
                }
            } catch(e) {}
        }

        function renderTagList() {
            const sceneData = communicationTags[currentTagCategory];
            if (!sceneData) return;
            const sel = selectedTags[currentCommunicationStudent] || {};
            let html = '';
            sceneData.tags.forEach(tag => {
                const checked = sel[tag.id] ? ' checked' : '';
                const cls = sel[tag.id] ? ' selected' : '';
                const icons = sceneEditMode ? '<span class="tag-icon edit" onclick="event.stopPropagation();event.preventDefault();startEditTag(\'' + tag.id + '\')" title="编辑">✎</span><span class="tag-icon del" onclick="event.stopPropagation();event.preventDefault();deleteTag(\'' + tag.id + '\')" title="删除">✕</span>' : '';

        function updateTagCapsules() {

                });

        function collectPhaseData(student, dates) {
            const cls = getCurrentClass();
            if (!cls || !dates.length) return null;
            const allCols = {}, colOrder = [];
            dates.forEach(function(d) {
                const entry = getEntry(cls.id, d);
                if (!entry) return;
                const cols = entry.dateColumns || cls.columns || [];
                cols.forEach(function(c) {
                    const pure = stripMaxScore(c);
                    if (!allCols[pure]) { allCols[pure] = { raw: c, maxScore: extractMaxScore(c), values: [] }; colOrder.push(pure); }
                });
            });
            dates.forEach(function(d) {
                const entry = getEntry(cls.id, d);
                if (!entry) return;
                const rec = entry.records ? entry.records.find(function(r) { return r.name === student; }) : null;
                if (!rec) return;
                const cols = entry.dateColumns || cls.columns || [];
                cols.forEach(function(c, i) {
                    const pure = stripMaxScore(c);
                    if (!allCols[pure]) return;
                    const val = (rec.values[i] || '').trim();
                    const maxScore = extractMaxScore(c);
                    allCols[pure].values.push({ date: d, value: val, maxScore: maxScore, isEmpty: val === '', numVal: null });
                });
            });
            const colStats = {};
            colOrder.forEach(function(pure) {
                const info = allCols[pure];
                const vals = info.values;
                if (!vals.length) return;
                // 补算 numVal 和确定列类型
                const hasMaxScore = extractMaxScore(info.raw) > 0;
                const binaryCount = vals.filter(function(v) { return !v.isEmpty && isBinaryMarker(v.value); }).length;
                const gradedCount = vals.filter(function(v) { return !v.isEmpty && isGradedValue(v.value); }).length;
                const nonEmptyCount = vals.filter(function(v) { return !v.isEmpty; }).length;
                // 有满分标注但所有值都是二元标记 → 按勾选列处理
                const allBinaryOrEmpty = vals.every(function(v) { return v.isEmpty || isBinaryMarker(v.value); });
                const isNumericCol = (!allBinaryOrEmpty && hasMaxScore) || (gradedCount > 0 && binaryCount < nonEmptyCount * 0.5);
                if (isNumericCol) {
                    vals.forEach(function(v) {
                        if (!v.isEmpty) v.numVal = convertToNumber(v.value, v.maxScore);
                    });
                }
                const s = { colName: pure, sessionCount: vals.filter(function(v) { return !v.isEmpty; }).length, values: vals };
                if (isNumericCol) {
                    let sum = 0, cnt = 0, best = -Infinity, worst = Infinity, bestDate = '', worstDate = '';
                    vals.forEach(function(v) {
                        if (v.isEmpty || v.numVal === null) return;
                        const pct = v.maxScore > 0 ? Math.round(v.numVal / v.maxScore * 100) : v.numVal;
                        sum += pct; cnt++;
                        if (pct > best) { best = pct; bestDate = v.date; }
                        if (pct < worst) { worst = pct; worstDate = v.date; }
                    });
                    s.avgPct = cnt ? Math.round(sum / cnt) : 0;
                    s.bestPct = best; s.bestDate = bestDate;
                    s.worstPct = worst; s.worstDate = worstDate;
                    const nonEmpty = vals.filter(function(v) { return !v.isEmpty && v.numVal !== null; });
                    const half = Math.floor(nonEmpty.length / 2);
                    if (half > 0) {
                        let first = 0, second = 0, fc = 0, sc = 0;
                        for (let j = 0; j < half; j++) {
                            const v = nonEmpty[j]; first += v.maxScore > 0 ? Math.round(v.numVal / v.maxScore * 100) : v.numVal; fc++;
                        }
                        for (let j = nonEmpty.length - half; j < nonEmpty.length; j++) {
                            const v = nonEmpty[j]; second += v.maxScore > 0 ? Math.round(v.numVal / v.maxScore * 100) : v.numVal; sc++;
                        }
                        const fhAvg = fc ? first / fc : 0, shAvg = sc ? second / sc : 0;
                        s.trend = shAvg - fhAvg > 10 ? 'up' : (shAvg - fhAvg < -10 ? 'down' : 'stable');
                    } else { s.trend = 'stable'; }
                    s.isNumeric = true;
                } else {
                    let doneCount = 0, undoneCount = 0;
                    vals.forEach(function(v) {
                        if (v.isEmpty) return;
                        if (isBinaryUndone(v.value)) undoneCount++;
                        else doneCount++;
                    });
                    s.doneCount = doneCount; s.undoneCount = undoneCount;
                    const total = doneCount + undoneCount;
                    s.completionRate = total ? Math.round(doneCount / total * 100) : 0;
                    s.isNumeric = false;
                }
                colStats[pure] = s;
            });
            return { student: student, dates: dates.slice().sort(naturalSort), colStats: colStats, colOrder: colOrder };
        }

        function generatePhaseSummary(phaseData) {
            const student = phaseData.student;
            const nick = getNickname(student);
            const pronoun = getPronoun(student);
            const dateCount = phaseData.dates.length;
            const dateRange = phaseData.dates[0] + ' 至 ' + phaseData.dates[dateCount - 1];
            const sel = selectedTags[student] || {};
            const posTags = [], negTags = [];
            Object.keys(communicationTags).forEach(function(scene) {
                communicationTags[scene].tags.forEach(function(tag) {
                    if (!sel[tag.id]) return;
                    if (tag.pos === 1) posTags.push(tag.text);
                    else if (tag.pos === -1) negTags.push(tag.text);
                });
            });

            // 亮点段落
            const periodKey = student + '|periodic';
            const selCols = selectedDataCols[periodKey] || {};
            const highlights = [], concerns = [], undoneItems = [];
            phaseData.colOrder.forEach(function(pure) {
                if (selCols[pure] !== true) return;
                const s = phaseData.colStats[pure];
                if (!s) return;
                if (s.isNumeric) {
                    if (s.avgPct >= 80 && s.trend === 'up') {
                        highlights.push(s.colName + '一直在进步，最近表现越来越好');
                    } else if (s.avgPct >= 80) {
                        highlights.push(s.colName + '这块一直很稳，基础打得扎实');
                    } else if (s.avgPct >= 60 && s.trend === 'up') {
                        highlights.push(s.colName + '有明显进步，继续保持这个势头');
                    } else if (s.avgPct >= 60) {
                        concerns.push({ name: s.colName, detail: '整体不错但还不够稳定，建议多花点时间练习，重点注意准确度' });
                    } else if (s.trend === 'down') {
                        concerns.push({ name: s.colName, detail: '近期有所下滑，建议这周重点复习一下，把薄弱的地方补上来' });
                    } else {
                        concerns.push({ name: s.colName, detail: '这段时间得分偏低，建议从基础开始重新过一遍，每天坚持练一练' });
                    }
                } else {
                    const hasData = s.doneCount + s.undoneCount;
                    if (hasData === 0) return;
                    if (s.undoneCount === 0) {
                        highlights.push(s.colName + '每次都能按时完成，习惯很好');
                    } else if (s.undoneCount > 0) {
                        undoneItems.push(s.colName + '有' + s.undoneCount + '次没完成，记得督促补上，这个对巩固课堂内容很有帮助');
                    }
                }
            });

            // 判断基调
            const phaseTone = (concerns.length === 0 && highlights.length > 0) ? 'positive' : (concerns.length > highlights.length ? 'concern' : 'neutral');

            // 开场
            const parts = [];
            const label = dateCount === 1 ? phaseData.dates[0] : ('最近' + dateCount + '次课（' + dateRange + '）');
            parts.push(phaseOpening(nick, pronoun, label, phaseTone) + '\n');

            if (highlights.length) {
                parts.push(highlights.join('，') + '。');
            }
            if (posTags.length) {
                parts.push('课堂表现方面，' + posTags.join('，') + '。');
            }

            // 需要关注段落
            if (concerns.length) {
                const concernTexts = concerns.map(function(c) {
                    return c.name + '：' + c.detail;
                });
                parts.push('\n需要留意的地方：');
                parts.push(concernTexts.join('；') + '。');
            }
            if (negTags.length) {
                parts.push('另外，' + negTags.join('，') + '，这些方面还需要多引导。');
            }

            // 未完成提醒
            if (undoneItems.length) {
                parts.push('\n' + undoneItems.join('；') + '。');
            }

            // 结尾
            parts.push('\n' + phaseClosing(phaseTone));

            return parts.join('');
        }

                            colName + '有点波动，' + scoreNum + '，' + sug
                        ] : [
                            colName + scoreNum + '，得分偏低，' + sug,
                            colName + '得分偏低——' + scoreNum + '，' + sug,
                            colName + '错得比较多，' + scoreNum + '，' + sug,
                            '这块是目前需要重点抓的，' + colName + scoreNum + '，' + sug,
                            colName + '需要多花时间了，' + scoreNum + '，' + sug,
                            '先不着急，' + colName + scoreNum + '，' + sug
                        ];
                        const text = templates[Math.floor(Math.random() * templates.length)];
                        if (r >= 1 || r >= 0.8) great.push(text);
                        else if (r >= 0.6) ok.push(text);
                        else weak.push(text);
                    } else {
                        const done = val.trim() === '✅' || val.trim() === '已完成' || val.trim() === '✓';
                        const notDone = val.trim() === '❌' || val.trim() === '未完成';
                        if (done) great.push(colName + '已完成');
                        else if (notDone) undone.push(colName + '还没完成——' + _suggest(_colCat(colName), 'undone'));
                        else if (columnContainsKeyword(col, '备注') && val.trim()) {
                            // 智能关联：判断备注与哪个已勾选数据列相关
                            const noteText = val.trim();
                            let associated = '';
                            for (let j = 0; j < columns.length; j++) {
                                if (!selCols[j]) continue;
                                const otherName = stripMaxScore(columns[j]);
                                if (otherName.length >= 2 && !columnContainsKeyword(columns[j], '备注') && noteText.includes(otherName)) {
                                    associated = otherName;
                                    break;
                                }
                            }
                            if (associated) {
                                notes.push('关于' + associated + '：' + noteText);
                            } else {
                                notes.push(noteText);
                            }
                        }
                    }
                });
            }

            // 标签分类
            const sel = selectedTags[student] || {};
            const posTags = [], negTags = [], neuTags = [];
            Object.keys(communicationTags).forEach(scene => {
                communicationTags[scene].tags.forEach(tag => {
                    if (!sel[tag.id]) return;
                    if (tag.pos === 1) posTags.push(tag.text);
                    else if (tag.pos === -1) negTags.push(tag.text);
                    else neuTags.push(tag.text);
                });
            });

            if (!great.length && !ok.length && !weak.length && !undone.length && !posTags.length && !negTags.length && !neuTags.length && !notes.length) {
                const nick = getNickname(student);
                document.getElementById('commPreview').value = nick + '家长您好！今天' + nick + '在课堂上整体表现平稳，没有特别需要沟通的事项。如有任何问题随时联系我～';
                return;
            }

            const nick = getNickname(student);
            const posCount = great.length + posTags.length;
            const negCount = weak.length + undone.length + negTags.length;
            const dailyTone = (negCount === 0 && posCount > 0) ? 'positive' : (negCount > posCount ? 'concern' : 'neutral');
            const parts = [];
            parts.push(dailyOpening(nick, dailyTone));

            // 好的先说
            const allGood = [...great, ...posTags];
            if (allGood.length) {
                parts.push('\n\n' + allGood.slice(0, 4).join('，') + '。');
            }

            // ok 档 — 温和提醒
            if (ok.length) {
                parts.push('\n\n' + ok.join('，') + '。');
            }

            // 需要加强的 + 没完成的
            const needsWork = [...weak, ...undone, ...negTags];
            if (needsWork.length) {
                parts.push('\n\n' + needsWork.join('，') + '。');
            }

            // 中性期待
            if (neuTags.length) {
                parts.push('\n\n' + neuTags.join('，') + '。');
            }

            // 备注：智能关联到反馈内容中
            if (notes.length) {
                parts.push('\n\n' + notes.join('；'));
            }

            // 结尾
            parts.push('\n\n' + dailyClosing(nick, dailyTone));

            document.getElementById('commPreview').value = parts.join('');
        }

        function getAutoBackground(val, maxScore) {
            if (val === '' || val === null) return '';
            const str = String(val).trim();
            if (str === '未完成' || str === '❌' || str === '×') return '#f8d7da';
            if (maxScore > 0) {
                const score = convertToNumber(val, maxScore);
                if (score !== null && score !== undefined) {
                    if (score === 0) return '#f8d7da';
                    if (score === maxScore) return '#d4edda';
                }
            }
            return null;
        }

        function renderStatTableByColumn(colKeyword) {
            const cls = getCurrentClass();
            if (!cls) return;
            const dates = getDateList();
            const students = cls.students;

            // 以第一次课的列索引为基准，保证所有课次统一对齐
            let refIdx = -1;
            const firstDate = dates[0];
            if (firstDate) {
                const firstEntry = getEntry(cls.id, firstDate);
                if (firstEntry) {
                    refIdx = firstEntry.dateColumns.findIndex(c => columnContainsKeyword(c, colKeyword));
                }
            }

            let html = `<h3 style="text-align:center;margin-bottom:8px;">${escapeHtml(colKeyword)} 学情总结</h3>`;
            html += '<div class="stat-table-wrap"><table class="stat-table"><thead>';
            html += '<tr><th style="width:70px">学生</th>';
            dates.forEach(d => html += `<th style="width:110px">${escapeHtml(d)}</th>`);
            html += '</tr></thead><tbody>';

            students.forEach(stu => {
                html += `<tr><td>${escapeHtml(stu)}</td>`;
                dates.forEach(d => {
                    const entry = getEntry(cls.id, d);
                    let val = '', bg = '', displayVal = '';
                    if (entry) {
                        // 优先使用第一次课的索引作为统一基准，回退到关键词匹配
                        let idx = refIdx;
                        if (idx === -1 || idx >= entry.dateColumns.length || !columnContainsKeyword(entry.dateColumns[idx], colKeyword)) {
                            idx = entry.dateColumns.findIndex(c => columnContainsKeyword(c, colKeyword));
                        }
                        if (idx !== -1) {
                            const rec = entry.records.find(r => r.name === stu);
                            if (rec) {
                                val = rec.values[idx] || '';
                                bg = (rec.colors && rec.colors[idx]) ? rec.colors[idx] : '';
                            }
                            const maxScore = extractMaxScore(entry.dateColumns[idx]);
                            displayVal = val;
                            if (val !== '' && maxScore > 0 && /^\d+(\.\d+)?$/.test(String(val).trim())) {
                                displayVal = String(val).trim() + '/' + maxScore;
                            }
                            const autoBg = getAutoBackground(val, maxScore);
                            if (autoBg) bg = autoBg;
                        }
                    }
                    html += `<td style="background:${bg}">${escapeHtml(displayVal)}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            document.getElementById('statTableWrapper').innerHTML = html;
        }

        function renderStatTableByStudent(studentName) {
            const cls = getCurrentClass();
            if (!cls) return;
            const dates = getDateList();

            const allCols = new Set();
            const colOrder = [];
            dates.forEach(d => {
                const entry = getEntry(cls.id, d);
                if (entry) entry.dateColumns.forEach(c => {
                    const key = stripMaxScore(c);
                    if (!allCols.has(key)) { allCols.add(key); colOrder.push(c); }
                });
            });
            var columns = colOrder;

            let html = `<h3 style="text-align:center;margin-bottom:8px;">${escapeHtml(studentName)} 学情统计</h3>`;
            html += '<div class="stat-table-wrap"><table class="stat-table"><thead><tr><th style="width:70px">日期</th>';
            columns.forEach(col => html += `<th style="width:110px">${escapeHtml(stripMaxScore(col))}</th>`);
            html += '</tr></thead><tbody>';

            dates.forEach(d => {
                html += `<tr><td>${escapeHtml(d)}</td>`;
                const entry = getEntry(cls.id, d);
                const rec = entry ? entry.records.find(r => r.name === studentName) : null;
                columns.forEach(colRaw => {
                    let val = '', bg = '';
                    if (entry && rec) {
                        const keyword = stripMaxScore(colRaw);
                        const matchedCol = entry.dateColumns.find(c => columnContainsKeyword(c, keyword));
                        if (matchedCol) {
                            const idx = entry.dateColumns.indexOf(matchedCol);
                            if (idx !== -1) {
                                val = rec.values[idx] || '';
                                bg = (rec.colors && rec.colors[idx]) ? rec.colors[idx] : '';
                            }
                            const maxScore = extractMaxScore(matchedCol);
                            let displayVal = val;
                            if (val !== '' && maxScore > 0 && /^\d+(\.\d+)?$/.test(String(val).trim())) {
                                displayVal = String(val).trim() + '/' + maxScore;
                            }
                            const autoBg = getAutoBackground(val, maxScore);
                            if (autoBg) bg = autoBg;
                            html += `<td style="background:${bg}">${escapeHtml(displayVal)}</td>`;
                            return;
                        }
                    }
                    html += `<td></td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            document.getElementById('statTableWrapper').innerHTML = html;
        }

        window.exportStatExcel = function() {
            const target = document.getElementById('statTarget').value;
            if (!target) { showConfirm('请先选择统计目标'); return; }
            const title = '统计表_' + target;
            const wrapper = document.getElementById('statTableWrapper');
            const table = wrapper.querySelector('.stat-table');
            if (!table) return;
            const clone = table.cloneNode(true);
            clone.querySelectorAll('th,td').forEach(function(c){c.style.position='';c.style.left='';c.style.zIndex='';});
            var styleEl=document.createElement('style');
            styleEl.textContent='@page { size: landscape; margin: 10mm; } body{font-family:Arial;text-align:center}h3{text-align:center;margin:16px 0}table{border-collapse:collapse;margin:0 auto;table-layout:auto;width:auto}th{padding:10px 12px;border:1px solid #bfdbfe;text-align:center;background:#eff6ff;color:#1e40af;white-space:normal;word-break:break-word;mso-number-format:\\@;}td{padding:8px 10px;border:1px solid #bfdbfe;text-align:center;white-space:normal;word-break:break-word;mso-number-format:\\@;}tr:nth-child(even) td{background:#f8fafc}';
            var finalHtml='<html><head><meta charset="utf-8"><title>'+escapeHtml(title)+'</title>'+styleEl.outerHTML+'</head><body>'+clone.outerHTML+'</body></html>';
            const blob = new Blob([finalHtml], { type: 'application/vnd.ms-excel' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = title + '.xls';
            a.click();
        };

        window.exportStatImage = function() {
            const wrapper = document.getElementById('statTableWrapper');
            const table = wrapper.querySelector('.stat-table');
            const wrapDiv = wrapper.querySelector('.stat-table-wrap');
            const origStyle = wrapper.getAttribute('style') || '';
            const origTblStyle = table ? table.getAttribute('style') || '' : '';
            const origWrapStyle = wrapDiv ? wrapDiv.getAttribute('style') || '' : '';
            const origParentStyle = wrapper.parentNode.style.cssText;

            // 保存所有单元格样式，临时禁止换行
            const allCells = table ? table.querySelectorAll('th,td') : [];
            const origCellStyles = [];
            allCells.forEach(cell => {
                origCellStyles.push({ el: cell, ws: cell.style.whiteSpace, mw: cell.style.maxWidth });
                cell.style.whiteSpace = 'nowrap';
                cell.style.maxWidth = 'none';
            });

            // 解除所有限制，让表格完全展开
            wrapper.parentNode.style.overflow = 'visible';
            wrapper.parentNode.style.maxHeight = 'none';
            wrapper.style.overflow = 'visible';
            wrapper.style.maxHeight = 'none';
            wrapper.style.width = 'fit-content';
            wrapper.style.maxWidth = 'none';
            wrapper.style.borderRadius = '0';
            wrapper.style.margin = '0 auto';
            if (wrapDiv) {
                wrapDiv.style.overflow = 'visible';
                wrapDiv.style.maxHeight = 'none';
            }
            if (table) {
                table.style.width = 'auto';
                table.style.minWidth = 'auto';
            }

            html2canvas(wrapper, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                    wrapper.setAttribute('style', origStyle);
                    if (table) table.setAttribute('style', origTblStyle);
                    if (wrapDiv) wrapDiv.setAttribute('style', origWrapStyle);
                    wrapper.parentNode.style.cssText = origParentStyle;
                    origCellStyles.forEach(s => { s.el.style.whiteSpace = s.ws; s.el.style.maxWidth = s.mw; });

                    canvas.toBlob(blob => {
                        const target = document.getElementById('statTarget').value;
                        const title = `统计表_${target || '未选择'}`;
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `${title}.png`;
                        a.click();
                    });
                });
        };

        // 启动：检查 Supabase 会话
        window.addEventListener('DOMContentLoaded', async () => {
            // 请求浏览器持久存储权限
            if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist().then(granted => { if (granted) console.log('持久存储已启用'); });
            }

            // 迁移 localStorage → IndexedDB（仅首次）
            _idb._migrate().catch(function(){});

            // 沟通偏好：本地优先，云端后台加载
            commStyle = localStorage.getItem('_fb_comm_style') || '专业';
            commMode = localStorage.getItem('_fb_comm_mode') || 'daily';
            try { var saved = localStorage.getItem('_fb_comm_period_dates'); if (saved) commPeriodDates = JSON.parse(saved); } catch(e) { commPeriodDates = []; }
            // 后台从云端同步（不阻塞渲染）
            dbGet('commStyle').then(function(v) { if (v && v !== commStyle) { commStyle = v; localStorage.setItem('_fb_comm_style', v); } }).catch(function(){});
            dbGet('commMode').then(function(v) { if (v && v !== commMode) { commMode = v; localStorage.setItem('_fb_comm_mode', v); } }).catch(function(){});
            dbGet('commPeriodDates').then(function(v) { if (v && JSON.stringify(v) !== JSON.stringify(commPeriodDates)) { commPeriodDates = v; localStorage.setItem('_fb_comm_period_dates', JSON.stringify(v)); } }).catch(function(){});

            // 切后台 / 关页面时强制同步到云端
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && _userId) {
                    clearTimeout(saveFeedbackTimeout);
                    saveAllDataNow(false);
                }
            });
            window.addEventListener('beforeunload', () => {
                if (_userId) {
                    try {
                        var backup = JSON.stringify({classes, feedback, tools, analysisSel, time: Date.now()});
                        localStorage.setItem(_cacheKey('_fullBackup'), backup);
                    } catch(e) {
                        // quota 不够 → 只保存班级和工具（不含反馈详情）
                        try { localStorage.setItem(_cacheKey('_fullBackup'), JSON.stringify({classes, tools, analysisSel, time: Date.now(), _partial: true})); } catch(e2) {}
                    }
                }
            });
            window.addEventListener('pagehide', () => {
                if (_userId) {
                    try {
                        localStorage.setItem(_cacheKey('_fullBackup'), JSON.stringify({classes, feedback, tools, analysisSel, time: Date.now()}));
                    } catch(e) {
                        try { localStorage.setItem(_cacheKey('_fullBackup'), JSON.stringify({classes, tools, analysisSel, time: Date.now(), _partial: true})); } catch(e2) {}
                    }
                }
            });

            // 检查是否已有 Supabase 会话
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session && session.user) {
                    await onLoginSuccess(session.user);
                }
            } catch(e) {
                // Supabase 不可用时，登录页已默认显示，无需额外操作
                console.warn('Session check failed:', e.message);
            }

            // 键盘弹出时浮动按钮上移
            let floatSavedTop = floatBtnTop;
            document.addEventListener('focusin', e => {
                const tag = e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.closest('.cell-input')) {
                    const floatBtn = document.getElementById('floatBtn');
                    if (floatBtn) { floatSavedTop = parseInt(floatBtn.style.top) || floatBtnTop; floatBtn.style.top = '10px'; floatBtn.style.bottom = 'auto'; }
                }
            });
            document.addEventListener('focusout', e => {
                const related = e.relatedTarget;
                if (!related || (related.tagName !== 'INPUT' && related.tagName !== 'TEXTAREA' && !related.closest('.cell-input'))) {
                    setTimeout(() => {
                        const floatBtn = document.getElementById('floatBtn');
                        if (floatBtn && !document.activeElement || (document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA')) {
                            floatBtn.style.top = floatSavedTop + 'px'; floatBtn.style.bottom = 'auto';
                        }
                    }, 200);
                }
            });
            // 键盘弹出/收起时，确保活跃单元格不被遮挡
            if (window.visualViewport) {
                var vvTimer;
                window.visualViewport.addEventListener('resize', function() {
                    clearTimeout(vvTimer);
                    if (activeCell && document.activeElement === activeCell) {
                        vvTimer = setTimeout(function(){ scrollCellIntoView(activeCell); }, 150);
                    }
                });
            }
        });
        window.addEventListener('keydown', e => {
            if ((e.ctrlKey||e.metaKey)&&e.key==='z') {
                if(e.target.closest('.cell-input')){e.preventDefault();undo();}
            }
            if ((e.ctrlKey||e.metaKey)&&e.key==='y') {
                if(e.target.closest('.cell-input')){e.preventDefault();redo();}
            }
        });
    })();
    </script>
</body>
