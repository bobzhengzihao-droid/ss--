<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>班级每日反馈表 · 汇总分析</title>
    <link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://html2canvas.hertzen.com" crossorigin>
    <link rel="dns-prefetch" href="https://furpcqytmgxqkxlbselj.supabase.co">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://unpkg.com/mammoth@1.7.0/mammoth.browser.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            /* 蓝白配色风格 */
            --primary: #1e293b;
            --primary-light: #1e3a5f;
            --accent: #2563eb;
            --accent-light: #93c5fd;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.06), 0 4px 6px -2px rgba(0,0,0,0.03);
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --btn-radius: 9999px;
            --input-radius: 9999px;
            --input-bg: #f8fafc;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --table-header-bg: #eff6ff;
            --table-header-text: #1e40af;
            --table-border: #bfdbfe;
            --table-row-even: #f8fafc;
            --nav-height: 52px;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 4px);
            -webkit-font-smoothing: antialiased;
        }
        #mainApp { width: 100%; }
        .app-only { display: none; }
        body.logged-in #mainApp.app-only { display: block; }
        body.logged-in .nav-tabs.app-only { display: flex; }
        .tool-popup.app-only { display: none; }
        .tool-popup.app-only.open { display: flex; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }

        /* ===== HEADER ===== */
        .header {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 8px 12px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: none;
            gap: 8px;
        }
        .class-selector { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
        .class-selector > span:first-child { font-size: 1rem; }
        .class-name-display {
            font-weight: 600;
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: var(--btn-radius);
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition);
            border: 1px solid var(--table-border);
            line-height: 1.4;
            -webkit-tap-highlight-color: transparent;
        }
        .class-name-display:hover { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); }
        .class-name-display:active { transform: scale(0.95); opacity: 0.8; }

        /* ===== BUTTONS ===== */
        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--btn-radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all var(--transition);
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
            white-space: nowrap;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
        .btn:active { transform: scale(0.97); }
        .btn:focus { outline: none; }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            box-shadow: none;
        }
        .btn-outline:hover { background: #eff6ff; box-shadow: 0 2px 8px rgba(37,99,235,0.12); }
        .btn-outline:active { background: #dbeafe; transform: scale(0.97); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-xs {
            padding: 5px 10px;
            font-size: 11px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text);
            box-shadow: none;
            border-radius: var(--btn-radius);
            font-weight: 500;
        }
        .btn-xs:hover { background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); }
        .btn-xs:active { opacity: 0.7; transform: scale(0.96); }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow-md);
            border: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            transition: box-shadow var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        /* ===== BOTTOM NAV ===== */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border-radius: 9999px;
            padding: 5px;
            box-shadow: var(--shadow-lg);
            border: none;
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            z-index: 20;
            justify-content: center;
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px 6px;
            border-radius: var(--btn-radius);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
            min-width: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            transition: all var(--transition);
        }
        .nav-tab:hover { color: var(--accent); background: #eff6ff; }
        .nav-tab:active { transform: scale(0.95); opacity: 0.8; }
        .nav-tab.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(37,99,235,0.3);
        }
        @media (max-width: 400px) { .nav-tab { font-size: 11px; padding: 10px 6px; } .nav-tabs { padding: 5px; } }
        @media (max-width: 480px) {
            .btn { padding: 7px 14px; font-size: 12px; }
            .btn-sm { padding: 5px 10px; font-size: 11px; }
            .btn-xs { padding: 4px 8px; font-size: 10px; }
            .input { padding: 7px 10px; font-size: 12px; }
            .date-select { padding: 7px 10px; font-size: 12px; }
            .date-action-btn { width: 28px; height: 28px; font-size: 12px; }
            .class-name-display { max-width: 130px; font-size: 11px; padding: 4px 8px; }
        }
        /* ===== TABLE ===== */
        .table-wrapper {
            overflow: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--table-border);
            max-height: 60vh;
            position: relative;
            background: white;
        }
        .table-wrapper::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 3px; }
        .table-wrapper::-webkit-scrollbar-track { background: #eff6ff; }
        table { border-collapse: collapse; font-size: 13px; background: white; width: auto; min-width: 100%; table-layout: auto; }
        th {
            background: var(--table-header-bg);
            color: var(--table-header-text);
            font-weight: 600;
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--table-border);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
            font-size: 13px;
        }
        td {
            padding: 6px 8px;
            text-align: center;
            border: 1px solid var(--table-border);
            white-space: nowrap;
            vertical-align: middle;
        }
        tbody tr:nth-child(even) { background-color: var(--table-row-even); }
        tbody tr:hover { background-color: #eff6ff; }
        th:first-child, td:first-child { position: sticky; left: 0; z-index: 3; width: 45px; min-width: 45px; padding: 6px 6px; background-color: inherit; }
        th:first-child { z-index: 5; background-color: var(--table-header-bg); }
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 45px; z-index: 3; width: 80px; min-width: 80px; background-color: inherit; }
        th:nth-child(2) { z-index: 5; background-color: var(--table-header-bg); }
        .cell-input {
            border: 1.5px solid transparent;
            background: transparent;
            padding: 4px 8px;
            font-size: 13px;
            text-align: center;
            border-radius: var(--btn-radius);
            outline: none;
            min-width: 100px;
            box-sizing: border-box;
            transition: var(--transition);
        }
        .cell-input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .active-cell-highlight {
            border-color: var(--accent) !important;
            background: #fff !important;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15) !important;
        }
        .save-indicator { font-size: 13px; color: var(--success); font-weight: 600; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
        .th-input { width: 100%; border: none; background: transparent; font-weight: 600; text-align: center; color: inherit; font-size: inherit; outline: none; padding: 2px; }
        .th-input:focus { background: rgba(255,255,255,0.9); border-radius: 6px; outline: 2px solid var(--accent-light); }

        /* ===== DATE SELECTOR ===== */
        .date-selector-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .date-select {
            padding: 8px 14px;
            border-radius: var(--btn-radius);
            border: 1.5px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            min-width: 96px;
            transition: var(--transition);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .date-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .date-select:hover { border-color: var(--accent-light); }
        .date-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .date-action-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
        .date-action-btn:active { transform: scale(0.9); opacity: 0.7; }
        .date-action-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

        /* ===== DATE CHIPS (保留用于其他地方) ===== */
        .date-chip {
            background: var(--input-bg);
            padding: 8px 16px;
            border-radius: var(--btn-radius);
            font-weight: 600;
            font-size: 12px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .date-chip:hover { border-color: var(--accent); background: #eff6ff; }
        .date-chip:active { transform: scale(0.95); opacity: 0.8; }
        .date-chip.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
        }
        .date-chip .delete-date { cursor: pointer; font-weight: bold; margin-left: 4px; color: inherit; opacity: 0.7; }
        .date-chip .delete-date:hover { opacity: 1; }

        /* ===== COLLAPSIBLE ===== */
        .style-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; }
        .capsule-btn {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            transition: var(--transition);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        .capsule-btn:hover { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); box-shadow: var(--shadow); }
        .capsule-btn:active { background: #e2e8f0; transform: scale(0.99); }
        .capsule-btn[aria-expanded="true"] { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
        .collapsible { margin-bottom: 12px; }
        .collapsible:last-child { margin-bottom: 0; }
        .collapsible-content {
            padding: 12px;
            background: var(--card-bg);
            border-radius: 0 0 var(--radius) var(--radius);
            margin-top: 0;
            border: 1.5px solid var(--border);
            border-top: none;
            display: none;
        }

        /* ===== FLOAT BUTTON & POPUP ===== */
        .float-btn {
            position: fixed;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(37,99,235,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            touch-action: none;
            user-select: none;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .float-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(37,99,235,0.5); }
        .float-btn:active { transform: scale(0.9); opacity: 0.8; }
        .tool-popup {
            position: fixed;
            z-index: 9998;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            max-width: 260px;
            width: 80%;
            max-height: 360px;
            overflow-y: auto;
            touch-action: none;
            user-select: none;
            border: 1px solid var(--border-light);
        }
        .tool-popup.open { display: flex; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; cursor: move; font-weight: 600; color: var(--primary); }
        .close-popup { background: #f1f5f9; border: none; font-size: 14px; cursor: pointer; color: var(--text-light); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: var(--transition); -webkit-tap-highlight-color: transparent; }
        .close-popup:hover { background: #e5e7eb; color: var(--text); }
        .close-popup:active { transform: scale(0.85); opacity: 0.7; }
        .quick-tag {
            padding: 6px 12px;
            border-radius: var(--btn-radius);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .quick-tag:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .quick-tag:active { transform: scale(0.92); opacity: 0.75; }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .color-dot:hover { transform: scale(1.15); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .color-dot:active { transform: scale(0.85); opacity: 0.7; }
        .tool-edit-panel { display: none; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
        .tool-edit-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; background: var(--input-bg); padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }
        .tool-edit-row input[type="text"] { flex: 1; min-width: 50px; padding: 3px 6px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--input-radius); outline: none; background: var(--card-bg); }
        .tool-edit-row input[type="text"]:focus { border-color: var(--accent); }
        .tool-edit-row input[type="color"] { width: 28px; height: 24px; border: 1px solid var(--border); border-radius: 4px; padding: 0; cursor: pointer; background: none; }
        .tool-edit-row .btn.btn-xs { padding: 3px 6px; font-size: 10px; }
        .popup-footer {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 2px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .popup-action-btn {
            padding: 7px 14px;
            border-radius: var(--btn-radius);
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .popup-action-btn:hover { background: #eff6ff; border-color: var(--accent-light); }
        .popup-action-btn:active { background: #dbeafe; transform: scale(0.95); opacity: 0.8; }

        /* ===== CLASS LIST ===== */
        .class-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-radius: var(--btn-radius);
            padding: 12px 16px;
            border-left: 3px solid var(--accent);
            margin-bottom: 8px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .class-card:hover {
            background: #eff6ff;
            transform: translateX(3px);
            box-shadow: var(--shadow-md);
        }
        .class-card:active { transform: scale(0.98); opacity: 0.8; }
        .class-card-wrapper { transition: transform 0.25s ease; }
        .class-card-wrapper.dragging { opacity: 0.3; z-index: 999; transition: none; }
        .drag-handle {
            cursor: grab; touch-action: none; user-select: none;
            font-size: 20px; color: var(--text-muted); flex-shrink: 0;
            line-height: 1; margin-right: 4px;
        }
        .drag-handle:active { cursor: grabbing; }
        .class-card-wrapper.drag-shift-down { transform: translateY(calc(100% + 8px)); }
        .class-card-wrapper.drag-shift-up { transform: translateY(calc(-100% - 8px)); }
        .class-card-name { font-weight: 600; color: var(--primary); font-size: 14px; text-align: left; }
        .student-modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin-top: 10px;
            padding: 16px;
            border: 1px solid var(--border-light);
            display: none;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
            overflow-x: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .student-modal.open { display: flex; animation: modalFadeIn 0.2s ease-out; }
        .class-card, .class-card * { -webkit-tap-highlight-color: transparent; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 自定义对话框（替代原生prompt/confirm，兼容夸克等移动浏览器） */
        .custom-dialog-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,23,42,0.4); display: flex; align-items: center;
            justify-content: center; z-index: 99999; animation: modalFadeIn 0.15s ease-out;
            -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
        }
