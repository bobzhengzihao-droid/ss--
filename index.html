<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>班级每日反馈表 · 汇总分析</title>
    <link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://html2canvas.hertzen.com" crossorigin>
    <link rel="dns-prefetch" href="https://furpcqytmgxqkxlbselj.supabase.co">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://unpkg.com/mammoth@1.7.0/mammoth.browser.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            /* 蓝白配色风格 */
            --primary: #1e293b;
            --primary-light: #1e3a5f;
            --accent: #2563eb;
            --accent-light: #93c5fd;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.06), 0 4px 6px -2px rgba(0,0,0,0.03);
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --btn-radius: 9999px;
            --input-radius: 9999px;
            --input-bg: #f8fafc;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --table-header-bg: #eff6ff;
            --table-header-text: #1e40af;
            --table-border: #bfdbfe;
            --table-row-even: #f8fafc;
            --nav-height: 52px;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 4px);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        input, textarea, button {
            -webkit-tap-highlight-color: transparent;
        }
        input[type="text"], input[type="password"], input[type="number"], textarea {
            -webkit-appearance: none;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, textarea:focus {
            outline: none;
        }
        #mainApp { width: 100%; }
        .app-only { display: none; }
        body.logged-in #mainApp.app-only { display: block; }
        body.logged-in .nav-tabs.app-only { display: flex; }
        .tool-popup.app-only { display: none; }
        .tool-popup.app-only.open { display: flex; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }

        /* ===== HEADER ===== */
        .header {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 8px 12px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: none;
            gap: 8px;
        }
        .class-selector { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
        .class-selector > span:first-child { font-size: 1rem; }
        .class-name-display {
            font-weight: 600;
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: var(--btn-radius);
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition);
            border: 1px solid var(--table-border);
            line-height: 1.4;
            -webkit-tap-highlight-color: transparent;
        }
        .class-name-display:hover { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); }
        .class-name-display:active { transform: scale(0.95); opacity: 0.8; }

        /* ===== BUTTONS ===== */
        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--btn-radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all var(--transition);
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
            white-space: nowrap;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
        .btn:active { transform: scale(0.97); }
        .btn:focus { outline: none; }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            box-shadow: none;
        }
        .btn-outline:hover { background: #eff6ff; box-shadow: 0 2px 8px rgba(37,99,235,0.12); }
        .btn-outline:active { background: #dbeafe; transform: scale(0.97); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-xs {
            padding: 5px 10px;
            font-size: 11px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text);
            box-shadow: none;
            border-radius: var(--btn-radius);
            font-weight: 500;
        }
        .btn-xs:hover { background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); }
        .btn-xs:active { opacity: 0.7; transform: scale(0.96); }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow-md);
            border: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            transition: box-shadow var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        /* ===== BOTTOM NAV ===== */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border-radius: 9999px;
            padding: 5px;
            box-shadow: var(--shadow-lg);
            border: none;
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            z-index: 20;
            justify-content: center;
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px 6px;
            border-radius: var(--btn-radius);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
            min-width: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            transition: all var(--transition);
        }
        .nav-tab:hover { color: var(--accent); background: #eff6ff; }
        .nav-tab:active { transform: scale(0.95); opacity: 0.8; }
        .nav-tab.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(37,99,235,0.3);
        }
        @media (max-width: 400px) { .nav-tab { font-size: 13px; padding: 10px 6px; } .nav-tabs { padding: 5px; } }
        @media (max-width: 480px) {
            .btn { padding: 8px 14px; font-size: 13px; }
            .btn-sm { padding: 6px 10px; font-size: 12px; }
            .btn-xs { padding: 5px 8px; font-size: 11px; }
            .input { padding: 8px 10px; font-size: 14px; }
            .date-select { padding: 8px 10px; font-size: 14px; }
            .date-action-btn { width: 28px; height: 28px; font-size: 14px; }
            .class-name-display { max-width: 130px; font-size: 13px; padding: 5px 8px; }
            table { font-size: 13px; }
            .cell-input { font-size: 14px; }
            .header { font-size: 13px; }
            .card-title { font-size: 1rem; }
        }
        /* ===== TABLE ===== */
        .table-wrapper {
            overflow: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--table-border);
            max-height: 60vh;
            position: relative;
            background: white;
        }
        .table-wrapper::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 3px; }
        .table-wrapper::-webkit-scrollbar-track { background: #eff6ff; }
        table { border-collapse: collapse; font-size: 13px; background: white; width: auto; min-width: 100%; table-layout: auto; }
        th {
            background: var(--table-header-bg);
            color: var(--table-header-text);
            font-weight: 600;
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--table-border);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
            font-size: 13px;
        }
        td {
            padding: 6px 8px;
            text-align: center;
            border: 1px solid var(--table-border);
            white-space: nowrap;
            vertical-align: middle;
        }
        tbody tr:nth-child(even) { background-color: var(--table-row-even); }
        tbody tr:hover { background-color: #eff6ff; }
        th:first-child, td:first-child { position: sticky; left: 0; z-index: 3; width: 45px; min-width: 45px; padding: 6px 6px; background-color: inherit; }
        th:first-child { z-index: 5; background-color: var(--table-header-bg); }
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 45px; z-index: 3; width: 80px; min-width: 80px; background-color: inherit; }
        th:nth-child(2) { z-index: 5; background-color: var(--table-header-bg); }
        .cell-input {
            border: 1.5px solid transparent;
            background: transparent;
            padding: 4px 8px;
            font-size: 13px;
            text-align: center;
            border-radius: var(--btn-radius);
            outline: none;
            min-width: 100px;
            box-sizing: border-box;
            transition: var(--transition);
        }
        .cell-input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .active-cell-highlight {
            border-color: var(--accent) !important;
            background: #fff !important;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15) !important;
        }
        .save-indicator { font-size: 13px; color: var(--success); font-weight: 600; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
        .th-input { width: 100%; border: none; background: transparent; font-weight: 600; text-align: center; color: inherit; font-size: inherit; outline: none; padding: 2px; }
        .th-input:focus { background: rgba(255,255,255,0.9); border-radius: 6px; outline: 2px solid var(--accent-light); }

        /* ===== DATE SELECTOR ===== */
        .date-selector-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .date-select {
            padding: 8px 14px;
            border-radius: var(--btn-radius);
            border: 1.5px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            min-width: 96px;
            transition: var(--transition);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .date-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .date-select:hover { border-color: var(--accent-light); }
        .date-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .date-action-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
        .date-action-btn:active { transform: scale(0.9); opacity: 0.7; }
        .date-action-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

        /* ===== DATE CHIPS (保留用于其他地方) ===== */
        .date-chip {
            background: var(--input-bg);
            padding: 8px 16px;
            border-radius: var(--btn-radius);
            font-weight: 600;
            font-size: 12px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .date-chip:hover { border-color: var(--accent); background: #eff6ff; }
        .date-chip:active { transform: scale(0.95); opacity: 0.8; }
        .date-chip.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
        }
        .date-chip .delete-date { cursor: pointer; font-weight: bold; margin-left: 4px; color: inherit; opacity: 0.7; }
        .date-chip .delete-date:hover { opacity: 1; }

        /* ===== COLLAPSIBLE ===== */
        .style-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; }
        .capsule-btn {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            transition: var(--transition);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        .capsule-btn:hover { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); box-shadow: var(--shadow); }
        .capsule-btn:active { background: #e2e8f0; transform: scale(0.99); }
        .capsule-btn[aria-expanded="true"] { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
        .collapsible { margin-bottom: 12px; }
        .collapsible:last-child { margin-bottom: 0; }
        .collapsible-content {
            padding: 12px;
            background: var(--card-bg);
            border-radius: 0 0 var(--radius) var(--radius);
            margin-top: 0;
            border: 1.5px solid var(--border);
            border-top: none;
            display: none;
        }

        /* ===== FLOAT BUTTON & POPUP ===== */
        .float-btn {
            position: fixed;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(37,99,235,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            touch-action: none;
            user-select: none;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .float-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(37,99,235,0.5); }
        .float-btn:active { transform: scale(0.9); opacity: 0.8; }
        .tool-popup {
            position: fixed;
            z-index: 9998;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            max-width: 260px;
            width: 80%;
            max-height: 360px;
            overflow-y: auto;
            touch-action: none;
            user-select: none;
            border: 1px solid var(--border-light);
        }
        .tool-popup.open { display: flex; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; cursor: move; font-weight: 600; color: var(--primary); }
        .close-popup { background: #f1f5f9; border: none; font-size: 14px; cursor: pointer; color: var(--text-light); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: var(--transition); -webkit-tap-highlight-color: transparent; }
        .close-popup:hover { background: #e5e7eb; color: var(--text); }
        .close-popup:active { transform: scale(0.85); opacity: 0.7; }
        .quick-tag {
            padding: 6px 12px;
            border-radius: var(--btn-radius);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .quick-tag:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .quick-tag:active { transform: scale(0.92); opacity: 0.75; }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .color-dot:hover { transform: scale(1.15); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .color-dot:active { transform: scale(0.85); opacity: 0.7; }
        .tool-edit-panel { display: none; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
        .tool-edit-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; background: var(--input-bg); padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }
        .tool-edit-row input[type="text"] { flex: 1; min-width: 50px; padding: 3px 6px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--input-radius); outline: none; background: var(--card-bg); }
        .tool-edit-row input[type="text"]:focus { border-color: var(--accent); }
        .tool-edit-row input[type="color"] { width: 28px; height: 24px; border: 1px solid var(--border); border-radius: 4px; padding: 0; cursor: pointer; background: none; }
        .tool-edit-row .btn.btn-xs { padding: 3px 6px; font-size: 10px; }
        .popup-footer {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 2px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .popup-action-btn {
            padding: 7px 14px;
            border-radius: var(--btn-radius);
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .popup-action-btn:hover { background: #eff6ff; border-color: var(--accent-light); }
        .popup-action-btn:active { background: #dbeafe; transform: scale(0.95); opacity: 0.8; }

        /* ===== CLASS LIST ===== */
        .class-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-radius: var(--btn-radius);
            padding: 12px 16px;
            border-left: 3px solid var(--accent);
            margin-bottom: 8px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .class-card:hover {
            background: #eff6ff;
            transform: translateX(3px);
            box-shadow: var(--shadow-md);
        }
        .class-card:active { transform: scale(0.98); opacity: 0.8; }
        .class-card-wrapper { transition: transform 0.25s ease; }
        .class-card-wrapper.dragging { opacity: 0.3; z-index: 999; transition: none; }
        .drag-handle {
            cursor: grab; touch-action: none; user-select: none;
            font-size: 20px; color: var(--text-muted); flex-shrink: 0;
            line-height: 1; margin-right: 4px;
        }
        .drag-handle:active { cursor: grabbing; }
        .class-card-wrapper.drag-shift-down { transform: translateY(calc(100% + 8px)); }
        .class-card-wrapper.drag-shift-up { transform: translateY(calc(-100% - 8px)); }
        .class-card-name { font-weight: 600; color: var(--primary); font-size: 14px; text-align: left; }
        .student-modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin-top: 10px;
            padding: 16px;
            border: 1px solid var(--border-light);
            display: none;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
            overflow-x: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .student-modal.open { display: flex; animation: modalFadeIn 0.2s ease-out; }
        .class-card, .class-card * { -webkit-tap-highlight-color: transparent; }
        @keyframes modalFadeIn {

        .student-list-item {

        .settings-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

        /* ===== LOGIN OVERLAY ===== */
        .login-overlay {

        @media (max-width: 640px) {

    <!-- 登录浮层 -->

\n2. 语言分寸感：语气干脆、直接，少用"哈、嘛、呀"这类语气词，可保留🙏表示尊重。措辞明确不含糊，该说"必须完成"就说"必须完成"，该说"需要重视"就说"需要重视"。不替孩子找借口，不帮家长打圆场。\n3. 逻辑结构：优点简单带过，重点放在需要改进的问题上。开场随机变换："情况直接说""今天的反馈比较直接""不绕弯子，直接说重点""有几个问题需要正视""我不兜圈子了"。逐条说清问题、为什么重要、家长需要做什么。从优点切入问题时随机变换："好的方面就不多说了，直接说问题""简单说两句好的，重点在后面""先说句好的，然后进入正题"。问题之间用"另外""还有一件事""再说一个"串联。收尾随机变换："请务必落实""下次课我会检查""这件事不能再拖了""请这周内给我反馈""希望下次课能看到改善"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。问题就直接说问题，不用"成长空间""提升空间"这类词包装。\n5. 整体观感：读起来让家长感受到"老师是认真的，这事得重视"，有适度紧迫感但不是发脾气，而是负责任地敲警钟。',"幽默":'你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位幽默、有亲和力的老师，善于用轻松的方式把严肃的事说明白。风格是"把话说软，把事办好"，让家长会心一笑中接收到信息，不板着脸说教。\n2. 语言分寸感：适度用"哈哈""哎呀"等轻松语气词和😅😂🙈等表情营造轻松感，但点到为止，不能让家长觉得你在拿孩子的问题开玩笑。措辞可以用形象有趣的表达化解尴尬，比如字迹潦草说"字写得像在跳舞"，作业没做说"作业还在放假中"。提要求用"咱们悄悄使把劲""这个技能得点亮一下"这类好玩的说法。关键是：幽默包装建议，不是嘲讽孩子。对孩子的态度始终是善意的。\n3. 逻辑结构：先用轻松方式说好的方面。开场随机变换："来，给您播报一下今天的战况""前方发来课堂快报""今天的表现报告来了""今日份观察日记请查收""叮！您有一条课堂速递"。用"不过嘛""还有个事儿得唠叨一句""好的说完了，来个小小的但是""接下来是温馨提示时间""说完开心的，再说个需要一起加油的"俏皮转折。收尾随机变换："行嘞，回去盯一盯哈""好了我念叨完了，辛苦辛苦""下课！回家记得检查哦""今天先这样，明天继续战斗""拜拜，记得看群通知"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。幽默是调味料，信息本身不能打折，该说的问题还是要说到位。\n5. 整体观感：读起来像一位性格开朗的老师，课间用轻松口吻跟家长吐个槽又加个油。家长读完觉得"这老师挺逗的，回去我盯盯孩子"。',"文艺":'你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位有书卷气、心思细腻的老师，善于用温润的文字传递教育的温度。表达不急不躁，像傍晚灯下写一封短笺，让家长读完心里柔软一下，又清楚该往哪里使劲。\n2. 语言分寸感：用词可以偏雅致一些但不要晦涩，毕竟还是老师在微信上说话。可以适当用比喻让表达更生动，比如把进步比作"抽枝展叶"、粗心比作"小石子绊了脚"。节奏舒缓，句子可以稍长但读起来要流畅。慎用网络语气词，表情用 🍃✨📝 这类安静的就好。文艺是形式不是目的，内核仍然是清晰的老师口吻，只是把"你要怎样"换成"我们一起等一等他""这块土壤再松松土"。\n3. 逻辑结构：先铺温暖底色。开场随机变换："今日课堂，跟您聊聊这孩子""傍晚了，跟您说说今天的模样""这些细小的事，想讲给您听""课后写几句，关于今天的样子""今天的他，像一页正在展开的书"。需要改进处轻轻放入，像翻到折了角的一页。从表扬过渡到提醒时随机变换："不过有一个小细节想轻轻提一下""另外有件小事，跟您说说""还有一页，翻过去看看""顺带提一句""说完了好的，再轻轻说一句需要留意的"。收尾随机变换："愿他慢慢长，稳稳走""我们一起等等他""夜安，慢慢来""每朵花都有自己的花期""期待他下一次的表现"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。用意象和比喻去包装，但信息本身不能模糊，家长读完要知道具体问题是什么、该怎么配合。\n5. 整体观感：读起来不像工作消息，更像一段教育随笔。让家长觉得"这位老师心里装着孩子"，从而更愿意信任和配合。',"学术":'你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位兼具教学实践与理论素养的专家型教师。表达精准、克制，每一句反馈背后都有专业判断做支撑。不煽情、不套近乎，靠专业洞察本身建立信任。距离感也是一种尊重。\n2. 语言分寸感：用词追求准确而非华丽。可适当用教育心理学、语言学等术语精准定位问题，比如"语音意识薄弱""表达准确率不稳定""书写规范性不足"。术语后面要跟一句通俗解释，避免显得在拽词。慎用语气词和表情，可偶尔用🙏表示尊重。\n3. 逻辑结构：现象描述→专业判断→具体建议。先说观察到的表现，再给出专业解读，最后落到具体行动上。开场随机变换："今天跟您反馈一下学习情况""今日课堂观察，跟您聊聊""今天的学情，跟您说说""课后整理了今天的要点""今天的表现，我的判断是这样的"。从数据过渡到评语时随机变换："综合来看""我的判断是""这说明""反映出""值得注意的趋势是"。收尾随机变换："以上为今天的情况汇总""保持关注，定期跟您更新""有疑问随时跟我交流""下次课我会对照验证""我会在后续课堂中持续观察"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。可以适度提炼更深一层的观察让反馈更有洞察力，但不能凭空捏造没提供的事实。\n5. 整体观感：读起来像一位学者型老师在课后用几分钟写的教学札记。家长读完觉得"问题清楚了，路径也有了，老师是懂的"，产生深度信任。',"安抚":'你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位温柔、沉稳、像清风一样让人安心的老师。你深知教育急不得，每个孩子都有自己的成长节奏。你传递信息的方式，能让家长紧绷的肩膀放松下来，相信"慢慢来，都会好的"。\n2. 语言分寸感：语速感要慢，用词要轻。多用"没关系""很正常""咱们慢慢来""不急的"这类消解焦虑的表达。不说"有问题""不好""落后"，换成"还在路上""还在适应中""暂时还不够稳当"。表情用😊🌿🌸这类温和的符号，不堆砌。语气词"呀""呢"用得像微风拂过水面，浅浅一下。\n3. 逻辑结构：从温暖瞬间或微小进步说起。开场随机变换："跟您轻轻说一下今天的情况""今天想跟您聊聊，一切都在正常轨道上""整体表现平稳，跟您说说细节""今天的小记录，您看看就好""关于今天，跟您聊几句，不着急的"。改进处包装成成长中正常的一小步，从好的过渡到需留意的随机变换："另外有个小小的观察""还有一件小事想轻轻提一下""顺带说一句，不用紧张""说完好的，再轻轻提一个地方"。收尾随机变换："我在呢，放心""没事的，我一直在关注他""您不用额外做什么，陪着就好""心安，一切都在变好""有我在课堂盯着，您放心"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。措辞裹上一层柔光滤镜，该说的事一件不落，但每一件都让人听了不着急。\n5. 整体观感：读起来像一阵初夏傍晚的微风，轻柔地吹进家长心里。家长读完觉得"孩子没事，老师挺用心的，我也不用那么紧绷"，焦虑被轻轻化解了。',"阳光":'你是少儿英语培训老师，要把零散信息润色成发给家长的微信消息。\n\n风格要求：\n1. 角色与气场：你是一位像小太阳一样的老师，浑身正能量。每条消息都带着温度和活力，让家长读完嘴角不自觉上扬。你相信每个孩子都是闪光的小星星，你的任务就是帮他们擦亮光芒。\n2. 语言分寸感：用词明亮轻快有节奏感。多用短句，像跳动的音符。善用叠词制造活泼感，比如"稳稳的""溜溜的""叮咚，有个小提醒"。表情大方使用☀️🌟🎉👏✨这类亮闪闪的符号。语气词"哦""哟""啦"轻盈上扬。夸孩子要具体又生动，比如"今天举手的速度快得像弹簧"，提问题说完立刻接上积极方案，不给家长留焦虑空间。\n3. 逻辑结构：先放好消息点燃气氛。开场随机变换："今天又有好消息啦""叮咚！进步快报来了""快看！今天超级棒""充满活力的一天，表现报告""嘿嘿，今天可厉害了"。用"不过呀""小小声说一句""还有一件小事""对了，差点忘了说"调皮切入，立刻接"咱们一起就能搞定"。收尾随机变换："一起加油呀""明天继续保持这股劲""太期待下次课了""加油加油，看好他""咱们把这种状态保持住"。\n4. 硬约束（最重要）：你只能改写表达方式和组织顺序，禁止增加原文没有提到的事实、夸奖、学习内容或评价，也禁止删除或遗漏原文中已经提到的任何数据、问题和表现。每个问题后面跟上正向行动建议，不能只把问题丢出去。\n5. 整体观感：读起来像一段元气满满的语音留言，让人听了想立刻
