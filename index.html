<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>班级每日反馈表 · 汇总分析</title>
    <link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://html2canvas.hertzen.com" crossorigin>
    <link rel="dns-prefetch" href="https://furpcqytmgxqkxlbselj.supabase.co">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://unpkg.com/mammoth@1.7.0/mammoth.browser.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            /* 蓝白配色风格 */
            --primary: #1e293b;
            --primary-light: #1e3a5f;
            --accent: #2563eb;
            --accent-light: #93c5fd;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.06), 0 4px 6px -2px rgba(0,0,0,0.03);
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --btn-radius: 9999px;
            --input-radius: 9999px;
            --input-bg: #f8fafc;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --table-header-bg: #eff6ff;
            --table-header-text: #1e40af;
            --table-border: #bfdbfe;
            --table-row-even: #f8fafc;
            --nav-height: 52px;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 4px);
            -webkit-font-smoothing: antialiased;
        }
        #mainApp { width: 100%; }
        .app-only { display: none; }
        body.logged-in #mainApp.app-only { display: block; }
        body.logged-in .nav-tabs.app-only { display: flex; }
        .tool-popup.app-only { display: none; }
        .tool-popup.app-only.open { display: flex; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }

        /* ===== HEADER ===== */
        .header {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 8px 12px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: none;
            gap: 8px;
        }
        .class-selector { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
        .class-selector > span:first-child { font-size: 1rem; }
        .class-name-display {
            font-weight: 600;
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: var(--btn-radius);
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition);
            border: 1px solid var(--table-border);
            line-height: 1.4;
            -webkit-tap-highlight-color: transparent;
        }
        .class-name-display:hover { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); }
        .class-name-display:active { transform: scale(0.95); opacity: 0.8; }

        /* ===== BUTTONS ===== */
        .btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--btn-radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all var(--transition);
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
            white-space: nowrap;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
        .btn:active { transform: scale(0.97); }
        .btn:focus { outline: none; }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            box-shadow: none;
        }
        .btn-outline:hover { background: #eff6ff; box-shadow: 0 2px 8px rgba(37,99,235,0.12); }
        .btn-outline:active { background: #dbeafe; transform: scale(0.97); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-xs {
            padding: 5px 10px;
            font-size: 11px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text);
            box-shadow: none;
            border-radius: var(--btn-radius);
            font-weight: 500;
        }
        .btn-xs:hover { background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); }
        .btn-xs:active { opacity: 0.7; transform: scale(0.96); }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow-md);
            border: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            transition: box-shadow var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        /* ===== BOTTOM NAV ===== */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border-radius: 9999px;
            padding: 5px;
            box-shadow: var(--shadow-lg);
            border: none;
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            z-index: 20;
            justify-content: center;
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px 6px;
            border-radius: var(--btn-radius);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
            min-width: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            transition: all var(--transition);
        }
        .nav-tab:hover { color: var(--accent); background: #eff6ff; }
        .nav-tab:active { transform: scale(0.95); opacity: 0.8; }
        .nav-tab.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(37,99,235,0.3);
        }
        @media (max-width: 400px) { .nav-tab { font-size: 11px; padding: 10px 6px; } .nav-tabs { padding: 5px; } }
        @media (max-width: 480px) {
            .btn { padding: 7px 14px; font-size: 12px; }
            .btn-sm { padding: 5px 10px; font-size: 11px; }
            .btn-xs { padding: 4px 8px; font-size: 10px; }
            .input { padding: 7px 10px; font-size: 12px; }
            .date-select { padding: 7px 10px; font-size: 12px; }
            .date-action-btn { width: 28px; height: 28px; font-size: 12px; }
            .class-name-display { max-width: 130px; font-size: 11px; padding: 4px 8px; }
        }
        /* ===== TABLE ===== */
        .table-wrapper {
            overflow: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--table-border);
            max-height: 60vh;
            position: relative;
            background: white;
        }
        .table-wrapper::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 3px; }
        .table-wrapper::-webkit-scrollbar-track { background: #eff6ff; }
        table { border-collapse: collapse; font-size: 13px; background: white; width: auto; min-width: 100%; table-layout: auto; }
        th {
            background: var(--table-header-bg);
            color: var(--table-header-text);
            font-weight: 600;
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--table-border);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
            font-size: 13px;
        }
        td {
            padding: 6px 8px;
            text-align: center;
            border: 1px solid var(--table-border);
            white-space: nowrap;
            vertical-align: middle;
        }
        tbody tr:nth-child(even) { background-color: var(--table-row-even); }
        tbody tr:hover { background-color: #eff6ff; }
        th:first-child, td:first-child { position: sticky; left: 0; z-index: 3; width: 45px; min-width: 45px; padding: 6px 6px; background-color: inherit; }
        th:first-child { z-index: 5; background-color: var(--table-header-bg); }
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 45px; z-index: 3; width: 80px; min-width: 80px; background-color: inherit; }
        th:nth-child(2) { z-index: 5; background-color: var(--table-header-bg); }
        .cell-input {
            border: 1.5px solid transparent;
            background: transparent;
            padding: 4px 8px;
            font-size: 13px;
            text-align: center;
            border-radius: var(--btn-radius);
            outline: none;
            min-width: 100px;
            box-sizing: border-box;
            transition: var(--transition);
        }
        .cell-input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .active-cell-highlight {
            border-color: var(--accent) !important;
            background: #fff !important;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15) !important;
        }
        .save-indicator { font-size: 13px; color: var(--success); font-weight: 600; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
        .th-input { width: 100%; border: none; background: transparent; font-weight: 600; text-align: center; color: inherit; font-size: inherit; outline: none; padding: 2px; }
        .th-input:focus { background: rgba(255,255,255,0.9); border-radius: 6px; outline: 2px solid var(--accent-light); }

        /* ===== DATE SELECTOR ===== */
        .date-selector-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .date-select {
            padding: 8px 14px;
            border-radius: var(--btn-radius);
            border: 1.5px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            min-width: 96px;
            transition: var(--transition);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .date-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .date-select:hover { border-color: var(--accent-light); }
        .date-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .date-action-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
        .date-action-btn:active { transform: scale(0.9); opacity: 0.7; }
        .date-action-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

        /* ===== DATE CHIPS (保留用于其他地方) ===== */
        .date-chip {
            background: var(--input-bg);
            padding: 8px 16px;
            border-radius: var(--btn-radius);
            font-weight: 600;
            font-size: 12px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .date-chip:hover { border-color: var(--accent); background: #eff6ff; }
        .date-chip:active { transform: scale(0.95); opacity: 0.8; }
        .date-chip.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
        }
        .date-chip .delete-date { cursor: pointer; font-weight: bold; margin-left: 4px; color: inherit; opacity: 0.7; }
        .date-chip .delete-date:hover { opacity: 1; }

        /* ===== COLLAPSIBLE ===== */
        .style-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; }
        .capsule-btn {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            transition: var(--transition);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        .capsule-btn:hover { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); box-shadow: var(--shadow); }
        .capsule-btn:active { background: #e2e8f0; transform: scale(0.99); }
        .capsule-btn[aria-expanded="true"] { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
        .collapsible { margin-bottom: 12px; }
        .collapsible:last-child { margin-bottom: 0; }
        .collapsible-content {
            padding: 12px;
            background: var(--card-bg);
            border-radius: 0 0 var(--radius) var(--radius);
            margin-top: 0;
            border: 1.5px solid var(--border);
            border-top: none;
            display: none;
        }

        /* ===== FLOAT BUTTON & POPUP ===== */
        .float-btn {
            position: fixed;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(37,99,235,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            touch-action: none;
            user-select: none;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .float-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(37,99,235,0.5); }
        .float-btn:active { transform: scale(0.9); opacity: 0.8; }
        .tool-popup {
            position: fixed;
            z-index: 9998;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            max-width: 260px;
            width: 80%;
            max-height: 360px;
            overflow-y: auto;
            touch-action: none;
            user-select: none;
            border: 1px solid var(--border-light);
        }
        .tool-popup.open { display: flex; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; cursor: move; font-weight: 600; color: var(--primary); }
        .close-popup { background: #f1f5f9; border: none; font-size: 14px; cursor: pointer; color: var(--text-light); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: var(--transition); -webkit-tap-highlight-color: transparent; }
        .close-popup:hover { background: #e5e7eb; color: var(--text); }
        .close-popup:active { transform: scale(0.85); opacity: 0.7; }
        .quick-tag {
            padding: 6px 12px;
            border-radius: var(--btn-radius);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .quick-tag:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .quick-tag:active { transform: scale(0.92); opacity: 0.75; }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .color-dot:hover { transform: scale(1.15); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .color-dot:active { transform: scale(0.85); opacity: 0.7; }
        .tool-edit-panel { display: none; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
        .tool-edit-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; background: var(--input-bg); padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }
        .tool-edit-row input[type="text"] { flex: 1; min-width: 50px; padding: 3px 6px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--input-radius); outline: none; background: var(--card-bg); }
        .tool-edit-row input[type="text"]:focus { border-color: var(--accent); }
        .tool-edit-row input[type="color"] { width: 28px; height: 24px; border: 1px solid var(--border); border-radius: 4px; padding: 0; cursor: pointer; background: none; }
        .tool-edit-row .btn.btn-xs { padding: 3px 6px; font-size: 10px; }
        .popup-footer {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 2px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .popup-action-btn {
            padding: 7px 14px;
            border-radius: var(--btn-radius);
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .popup-action-btn:hover { background: #eff6ff; border-color: var(--accent-light); }
        .popup-action-btn:active { background: #dbeafe; transform: scale(0.95); opacity: 0.8; }

        /* ===== CLASS LIST ===== */
        .class-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-radius: var(--btn-radius);
            padding: 12px 16px;
            border-left: 3px solid var(--accent);
            margin-bottom: 8px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .class-card:hover {
            background: #eff6ff;
            transform: translateX(3px);
            box-shadow: var(--shadow-md);
        }
        .class-card:active { transform: scale(0.98); opacity: 0.8; }
        .class-card-wrapper { transition: transform 0.25s ease; }
        .class-card-wrapper.dragging { opacity: 0.3; z-index: 999; transition: none; }
        .drag-handle {
            cursor: grab; touch-action: none; user-select: none;
            font-size: 20px; color: var(--text-muted); flex-shrink: 0;
            line-height: 1; margin-right: 4px;
        }
        .drag-handle:active { cursor: grabbing; }
        .class-card-wrapper.drag-shift-down { transform: translateY(calc(100% + 8px)); }
        .class-card-wrapper.drag-shift-up { transform: translateY(calc(-100% - 8px)); }
        .class-card-name { font-weight: 600; color: var(--primary); font-size: 14px; text-align: left; }
        .student-modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin-top: 10px;
            padding: 16px;
            border: 1px solid var(--border-light);
            display: none;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
            overflow-x: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .student-modal.open { display: flex; animation: modalFadeIn 0.2s ease-out; }
        .class-card, .class-card * { -webkit-tap-highlight-color: transparent; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 自定义对话框（替代原生prompt/confirm，兼容夸克等移动浏览器） */
        .custom-dialog-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,23,42,0.4); display: flex; align-items: center;
            justify-content: center; z-index: 99999; animation: modalFadeIn 0.15s ease-out;
            -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
        }

        function nameToEmail(name) {

        async function loginDirect(name, password) {
            const savedEmail = localStorage.getItem('_fb_name_email_' + name);

            let lastError = null;
            for (const email of candidates) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (!error) return { user: data.user, email };

        // ========== IndexedDB 封装（替代 localStorage）==========
        const _idb = (function() {
            let _db = null;
            function _open() {
                if (_db) return Promise.resolve(_db);
                return new Promise(function(resolve, reject) {
                    var req = indexedDB.open('FeedbackDB', 1);
                    req.onupgradeneeded = function() { req.result.createObjectStore('kv'); };
                    req.onsuccess = function() { _db = req.result; resolve(_db); };
                    req.onerror = function() { reject(req.error); };
                });
            }
            return {
                get: async function(key) {
                    try { var db = await _open(); } catch(e) { return null; }
                    return new Promise(function(resolve) {
                        var tx = db.transaction('kv', 'readonly');
                        var req = tx.objectStore('kv').get(key);
                        req.onsuccess = function() { resolve(req.result != null ? req.result : null); };
                        req.onerror = function() { resolve(null); };
                    });
                },
                set: async function(key, value) {
                    try { var db = await _open(); } catch(e) { return; }
                    return new Promise(function(resolve) {
                        var tx = db.transaction('kv', 'readwrite');
                        tx.objectStore('kv').put(value, key);
                        tx.oncomplete = function() { resolve(); };
                        tx.onerror = function() { resolve(); };
                    });
                },
                _migrate: async function() {
                    if (!localStorage) return;
                    var keys = [];
                    for (var i = 0; i < localStorage.length; i++) {
                        var k = localStorage.key(i);
                        if (k && k.indexOf('_fb_') === 0) keys.push(k);
                    }
                    if (!keys.length) return;
                    // Check if IDB already has data
                    var existing = await this.get(keys[0]);
                    if (existing != null) return; // Already migrated
                    for (var j = 0; j < keys.length; j++) {
                        try {
                            var raw = localStorage.getItem(keys[j]);
                            if (raw != null) await this.set(keys[j], JSON.parse(raw));
                        } catch(e) {}
                    }
                    console.log('[IDB] 已从 localStorage 迁移 ' + keys.length + ' 条数据');
                },
                scanKeys: async function(prefix) {
                    try { var db = await _open(); } catch(e) { return []; }
                    return new Promise(function(resolve) {
                        var tx = db.transaction('kv', 'readonly');
                        var keys = [];
                        var req = tx.objectStore('kv').openCursor();
                        req.onsuccess = function(e) {
                            var cursor = e.target.result;
                            if (cursor) {
                                if (typeof cursor.key === 'string' && cursor.key.indexOf(prefix) === 0) keys.push(cursor.key);
                                cursor.continue();
                            } else { resolve(keys); }
                        };
                        req.onerror = function() { resolve([]); };
                    });
                }
            };
        })();

        // ========== 数据库封装（Supabase 优先 + IndexedDB 备份）==========
        let _userId = null, _lastAccessToken = null, currentGender = '', currentDistrict = '';
        let campusConfig = [];
        let _lastKnownClassCount = 0;
        // ========== 多标签页同步（BroadcastChannel）==========
        const _bc = (function() {
            try {
                var bc = new BroadcastChannel('feedback_sync');
                bc.onmessage = async function(event) {
                    if (!event.data || event.data.type !== 'data_changed') return;
                    if (event.data.source === _bcTabsId) return;
                    console.log('[BC] 收到其他标签页的数据变更通知');
                    // 当前标签页有未保存编辑时不自动刷新，仅提示

                    // 无脏数据时静默重新加载
                    try {
                        await _reloadFromCloud();
                        _hideSyncWarning();
                        _rerenderCurrentView();

                return bc;
            } catch(e) { return null; }
        })();
        var _bcTabsId = 'tab_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        function _notifyOtherTabs(changedKeys) {
            if (!_bc) return;
            try { _bc.postMessage({ type: 'data_changed', keys: changedKeys || [], time: Date.now(), source: _bcTabsId }); } catch(e) {}
        }
        async function _reloadFromCloud() {
            var cloudClasses = null, cloudFeedback = null;
            try {
                var _ds = await supabase.auth.getSession();
                var _du = _ds && _ds.data && _ds.data.session && _ds.data.session.user;
                if (!_du) return;
                var cRes = await supabase.from('data_store').select('value').eq('user_id', _du.id).eq('key', 'classes').maybeSingle();
                if (cRes && cRes.data && cRes.data.value) cloudClasses = cRes.data.value;
                var fbRes = await supabase.from('data_store').select('key,value').eq('user_id', _du.id).like('key', 'fb|%');
                if (fbRes && fbRes.data) {
                    cloudFeedback = {};
                    fbRes.data.forEach(function(row) { cloudFeedback[row.key.substring(3)] = row.value; });
                }
            } catch(e) { console.warn('[BC] 云端查询失败:', e.message); return; }
            if (cloudClasses && cloudClasses.length) classes = cloudClasses;
            if (cloudFeedback) {
                Object.keys(cloudFeedback).forEach(function(k) {
                    var fbKey = k;
                    var entry = cloudFeedback[k];
                    if (feedback[fbKey]) {
                        var localTs = feedback[fbKey]._updatedAt || 0;
                        var cloudTs = entry._updatedAt || 0;
                        if (cloudTs > localTs) feedback[fbKey] = entry;
                    } else {
                        feedback[fbKey] = entry;
                    }
                });
            }
        }
        function _rerenderCurrentView() {
            try {
                if (typeof renderFeedbackTable === 'function') renderFeedbackTable();
                if (typeof renderCommunicationView === 'function') {
                    var cv = document.getElementById('view-communication');
                    if (cv && cv.style.display !== 'none') renderCommunicationView();
                }
                if (typeof renderClassList === 'function') renderClassList();
                if (typeof renderDateSelector === 'function') renderDateSelector();
            } catch(e) {}
        }
        function _cacheKey(k) { return '_fb_' + (_userId || 'anon') + '_' + k; }

        async function _saveKey(key, value) {
            // null = 删除
            if (value === null) {
                let cloudOk = true;
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    const user = session && session.user;
                    if (user) {
                        const { error } = await supabase.from('data_store').delete().eq('user_id', user.id).eq('key', key);
                        if (error) { console.error('[SAVE] 云端删除失败:', key, error.message); cloudOk = false; }
                    }
                } catch(e) { console.error('[SAVE] 云端删除异常:', key, e.message); cloudOk = false; }
                if (cloudOk) { try { _idb.set(_cacheKey(key), null); } catch(e) {} }
                return cloudOk;
            }
            let supabaseOk = false;
            try {
                const { data: { session } } = await supabase.auth.getSession();
                const user = session && session.user;
                if (user) {
                    // 锁一+锁二：classes 写入保护 + 自动备份
                    if (key === 'classes' && Array.isArray(value)) {
                        try {
                            var { data: oldRow } = await supabase.from('data_store')
                                .select('value').eq('user_id', user.id).eq('key', 'classes').maybeSingle();
                            var oldClasses = (oldRow && oldRow.value) ? oldRow.value : [];
                            var oldCount = Array.isArray(oldClasses) ? oldClasses.length : 0;
                            // 云端读不到 → 用本地持久化缓存兜底
                            var _usedCachedCount = false;
                            if (oldCount === 0 && _lastKnownClassCount > 0) { oldCount = _lastKnownClassCount; _usedCachedCount = true; }
                            // 锁一增强：从未确认过云端状态 + 云端读不到 → 禁止保存，防空数据覆盖
                            if (oldCount === 0 && _lastKnownClassCount === 0) {
                                _showSyncWarning('正在同步云端数据，请稍后操作');
                                return false;
                            }
                            var newCount = value.length;
                            // 锁一：旧数据 > 3 且新数据不到旧的一半 → 网络未加载完整，阻止覆盖
                            if (oldCount > 3 && newCount < oldCount / 2) {
                                var _lo = document.createElement('div');
                                _lo.className = 'custom-dialog-overlay';
                                _lo.innerHTML = '<div class="custom-dialog"><div class="custom-dialog-msg">数据加载不完整<br><br>云端有 '+oldCount+' 个班级，当前仅显示 '+newCount+' 个。<br>请刷新页面后重试。</div><div class="custom-dialog-btns"><button class="custom-dialog-btn-ok">刷新页面</button></div></div>';
                                _lo.querySelector('.custom-dialog-btn-ok').onclick = function() { location.reload(); };
                                document.body.appendChild(_lo);
                                _showSyncWarning('已阻止覆盖，请刷新页面');
                                return false;
                            }
                            // 锁二：写入前备份——只在新数据 ≥ 旧备份时才覆盖，保证永远保留班级数最多的版本
                            if (oldCount > 0 && oldClasses.length > 0) {
                                try {
                                    var existingBackup = await supabase.from('data_store').select('value').eq('user_id', user.id).eq('key', 'classes_backup').maybeSingle();
                                    var existingCount = 0;
                                    if (existingBackup && existingBackup.data && existingBackup.data.value) {
                                        var eb = existingBackup.data.value;
                                        var ebClasses = eb.classes || eb;
                                        existingCount = Array.isArray(ebClasses) ? ebClasses.length : 0;
                                    }
                                    // 新数据班数 ≥ 旧备份班数 → 覆盖；否则保留旧备份不动
                                    if (newCount >= existingCount) {
                                        var backupObj = { classes: JSON.parse(JSON.stringify(oldClasses)), _backupTime: new Date().toISOString() };
                                        await supabase.from('data_store').upsert({
                                            user_id: user.id, key: 'classes_backup', value: backupObj,
                                            updated_at: new Date().toISOString()
                                        }, { onConflict: 'user_id,key' }).then(function(){}, function(){});
                                    }
                                } catch(e) {}
                            }
                        } catch(e) {}
                    }
                    const { error } = await supabase.from('data_store').upsert({
                        user_id: user.id, key: key, value: value,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id,key' });
                    if (error) {
                        console.error('[SAVE] Supabase error:', key, error.message);
                        _showSyncWarning('云端保存失败: ' + error.message);
                    } else {
                        supabaseOk = true;
                        _hideSyncWarning();
                    }
                    // 记录 classes 云端同步时间
                    if (supabaseOk && key === 'classes') {
                        try { localStorage.setItem('_fb_cls_sync_ts_' + _userId, Date.now()); } catch(e) {}
                    }
                } else {
                    _showSyncWarning('未登录，请刷新页面重新登录');
                }
            } catch(e) {
                console.error('[SAVE] Supabase exception:', key, e.message);
                _showSyncWarning('云端连接失败，数据仅保存在本地');
            }
            // 始终写 IndexedDB（以防云端失败数据丢失）
            try { _idb.set(_cacheKey(key), value); } catch(e) {}
            // 记录 classes 本地保存时间（用于合并时判断本地是否更新）
            if (key === 'classes') {
                try { localStorage.setItem('_fb_cls_local_ts_' + _userId, Date.now()); } catch(e) {}
            }
            // 如果是 fb key 或 classes，更新全量备份
            if (key === 'classes' || (typeof key === 'string' && key.indexOf('fb|') === 0)) {
                try { _idb.set(_cacheKey('_fullBackup'), {classes: classes, feedback: feedback, tools: tools, analysisSel: analysisSel, time: Date.now()}); } catch(e) {}
            }
            return supabaseOk;
        }

        let _syncWarnEl = null;
        function _showSyncWarning(msg) {
            if (_syncWarnEl) { _syncWarnEl.textContent = '⚠️ ' + msg; return; }
            _syncWarnEl = document.createElement('div');

        function naturalSort(a,b) { const re=/(\d+)/g, aP=a.split(re).filter(Boolean), bP=b.split(re).filter(Boolean); for(let i=0;i<Math.max(aP.length,bP.length);i++){const av=aP[i]||'',bv=bP[i]||'',an=parseInt(av,10),bn=parseInt(bv,10); if(!isNaN(an)&&!isNaN(bn)){if(an!==bn)return an-bn;} else if(av!==bv)return av.localeCompare(bv);} return 0; }

        function saveFeedbackDebounced() {
            // 立即写 IndexedDB 全量备份（紧急恢复用）
            _idb.set(_cacheKey('_fullBackup'), {classes: classes, feedback: feedback, tools: tools, analysisSel: analysisSel, time: Date.now()}).catch(function(){});

            clearTimeout(saveFeedbackTimeout);

                var dirtySnapshot=_dirtyKeys;
                _dirtyKeys={};
                var allOk=true;
                var keys=Object.keys(dirtySnapshot);
                for(var i=0;i<keys.length;i++){
                    var k=keys[i],parts=k.split('|');

                // autoRecovery: localStorage 备份比 IndexedDB 更新 → 恢复
                if (lsBackup && lsBackup.classes && lsBackup.time) {

        let classDragData = null;
        let dragSuppressClick = false;

        function startClassDrag(e){
            // touch-action:none CSS already handles scroll prevention; only preventDefault for mouse to avoid text selection
            if (e.type === 'mousedown') e.preventDefault();
            e.stopPropagation();
            const w = e.currentTarget.closest('.class-card-wrapper');
            if(!w)return;
            const rects = Array.from(document.querySelectorAll('.class-card-wrapper')).map(el => ({ el, idx: parseInt(el.dataset.index), h: el.offsetHeight }));
            classDragData = {
                el: w, idx: parseInt(w.dataset.index), rects,
                startY: e.clientY !== undefined ? e.clientY : e.touches[0].clientY,
                currentTargetIdx: parseInt(w.dataset.index), moved: false
            };
            w.classList.add('dragging');
            document.addEventListener('mousemove', onClassDragMove);
            document.addEventListener('mouseup', onClassDragEnd);
            document.addEventListener('touchmove', onClassDragMove, { passive: false });
            document.addEventListener('touchend', onClassDragEnd);
        }

	        function onClassDragMove(e){
            if(!classDragData)return;
            e.preventDefault();
            const cy = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
            const dy = Math.abs(cy - classDragData.startY);
            if(!classDragData.moved && dy < 5)return;
            classDragData.moved = true;
            // 计算手指应该插入的位置（排除拖拽中的卡片，用中点判断）
            const allWrappers = document.querySelectorAll('.class-card-wrapper');
            let targetIdx = allWrappers.length - 1;
            for(let i = 0; i < allWrappers.length; i++) {
                if(allWrappers[i] === classDragData.el) continue;
                const r = allWrappers[i].getBoundingClientRect();
                if(cy < r.top + r.height / 2) { targetIdx = i; break; }
            }
            if(targetIdx !== classDragData.currentTargetIdx){
                classDragData.currentTargetIdx = targetIdx;
                // 让其他卡片让位
                const srcH = classDragData.rects[classDragData.idx].h + 8;
                allWrappers.forEach((el, i) => {
                    if(i === classDragData.idx)return;
                    let shiftY = 0;
                    if(classDragData.idx < targetIdx && i > classDragData.idx && i <= targetIdx) shiftY = -srcH;
                    if(classDragData.idx > targetIdx && i < classDragData.idx && i >= targetIdx) shiftY = srcH;
                    el.style.transform = shiftY ? `translateY(${shiftY}px)` : '';
                });
            }
            // 拖拽中的卡片跟随手指
            const offsetY = cy - classDragData.startY;
            classDragData.el.style.transform = `translateY(${offsetY}px)`;
            classDragData.el.style.zIndex = '999';
        }

        function onClassDragEnd(e){
            if(!classDragData)return;
            document.removeEventListener('mousemove', onClassDragMove);
            document.removeEventListener('mouseup', onClassDragEnd);
            document.removeEventListener('touchmove', onClassDragMove);
            document.removeEventListener('touchend', onClassDragEnd);
            classDragData.el.classList.remove('dragging');
            const toIdx = classDragData.currentTargetIdx;
            const fromIdx = classDragData.idx;
            // 清除所有transform
            document.querySelectorAll('.class-card-wrapper').forEach(w => w.style.transform = '');
            document.querySelectorAll('.class-card-wrapper').forEach(w => w.style.zIndex = '');
            if(classDragData.moved){
                dragSuppressClick = true;
                if(fromIdx !== toIdx){
                    const item = classes.splice(fromIdx, 1)[0];
                    classes.splice(toIdx, 0, item);
                    dbSet('classes', classes).catch(function(e) { console.warn('[SAVE] 班级排序保存失败:', e); });
                    renderClassList();
                }
            }
            classDragData = null;
        }

        function findColumnIndexAndMax(entry, keyword) {

                if (columnContainsKeyword(entry.dateColumns[i], keyword)) return { idx: i, maxScore: extractMaxScore(entry.dateColumns[i]) };
            }

        }
        function isBinaryDone(val) {
            var s = String(val).trim();
            if (!s) return false;
            if (s.indexOf('✅') !== -1 || s.indexOf('✓') !== -1) return true;
            if (/^(已|交|完)/.test(s)) return true;
            return false;
        }
        function isBinaryUndone(val) {
            var s = String(val).trim();
            if (!s) return false;
            if (s.indexOf('❌') !== -1 || s.indexOf('✗') !== -1) return true;
            if (/^(未|没|缺|忘|不)/.test(s)) return true;
            return false;
        }
        function isBinaryMarker(val) { return isBinaryDone(val) || isBinaryUndone(val); }

        function isGradedValue(val) {
            const s = String(val).trim();
            if (!s) return false;
            if (isBinaryMarker(s)) return false;
            if (/^\d+(\.\d+)?$/.test(s)) return true;
            if (/^[A-C][+-]{0,2}$/.test(s)) return true;
            if (['🏆','🥇','🥈','🥉','优秀','良好','及格','需努力','待提高'].includes(s)) return true;
            return false;
        }
        function isGradeValue(val) {
            var s = String(val).trim();
            if (!s) return false;
            // 字母等级：去内空格后检查是否以 A/B/C 开头（A + → A+ → 匹配；A+成绩 → 匹配）
            var norm = s.replace(/\s+/g, '');
            if (/^[A-C][+-]{0,2}/.test(norm)) return true;
            // 中文等级：包含匹配（优秀作品 → 匹配）
            var words = ['优秀','良好','及格','需努力','待提高','优','良','中','差'];
            for (var i = 0; i < words.length; i++) { if (s.indexOf(words[i]) !== -1) return true; }
            // 奖牌符号：包含匹配（🏆1 → 匹配）
            var emoji = ['🏆','🥇','🥈','🥉'];
            for (var j = 0; j < emoji.length; j++) { if (s.indexOf(emoji[j]) !== -1) return true; }
            return false;
        }
        function gradeToNumber(val) {
            var s = String(val).trim();
            var norm = s.replace(/\s+/g, '');
            var ltr = (norm.match(/^[A-C][+-]{0,2}/) || [''])[0];
            // 字母等级优先（更精准，不易误判）
            if (ltr) {
                if (ltr === 'A++') return 4;
                if (ltr === 'A+') return 3.5;
                if (ltr === 'A') return 3;
                if (ltr === 'A-') return 2.5;
                if (ltr === 'B++' || ltr === 'B+' || ltr === 'B' || ltr === 'B-') return 2;
                if (ltr === 'C++' || ltr === 'C+' || ltr === 'C' || ltr === 'C-') return 1;
            }
            // 中文等级 / 奖牌（包含匹配）
            if (s.indexOf('优秀') !== -1 || s.indexOf('🏆') !== -1 || s.indexOf('🥇') !== -1) return 4;
            if (s.indexOf('良好') !== -1 || s.indexOf('🥈') !== -1) return 3;
            if (s.indexOf('及格') !== -1 || s.indexOf('🥉') !== -1) return 2;
            if (s.indexOf('需努力') !== -1 || s.indexOf('待提高') !== -1) return 1;
            // 简写形式（仅开头或独立出现，避免「优」在句中被误判）
            if (s.indexOf('优') === 0 || s === '优') return 4;
            if (s.indexOf('良') === 0 || s === '良') return 3;
            if (s.indexOf('中') === 0 || s === '中') return 2;
            if (s.indexOf('差') === 0 || s === '差') return 1;
            // 未完成标记
            if (s.indexOf('❌') !== -1 || isBinaryUndone(s)) return 0;
            return null;
        }
        function convertToNumber(value, maxScore){
            if(value===''||value===null||value===undefined) return null;
            const str = String(value).trim();
            const m = maxScore || 100;
            if(str==='A++') return m;
            if(str==='A+') return Math.round(m * 0.98);
            if(str==='A') return Math.round(m * 0.90);
            if(str==='A-') return Math.round(m * 0.82);
            if(str==='B++'||str==='B+') return Math.round(m * 0.75);
            if(str==='B') return Math.round(m * 0.65);
            if(str==='B-') return Math.round(m * 0.55);
            if(str==='C+') return Math.round(m * 0.45);
            if(str==='C') return Math.round(m * 0.35);
            if(str==='🏆'||str==='🥇') return m;
            if(str==='🥈') return Math.round(m * 0.85);
            if(str==='🥉') return Math.round(m * 0.70);
            if(str==='优秀') return Math.round(m * 0.95);
            if(str==='良好') return Math.round(m * 0.80);
            if(str==='及格') return Math.round(m * 0.60);
            if(str==='需努力'||str==='待提高') return Math.round(m * 0.40);
            if(isBinaryDone(str) || isBinaryUndone(str)) return null;
            const num = parseInt(str, 10);
            if (!isNaN(num)) return num;
            return null;
        }

        function updateLineCharts(){
            const cls=getAnalysisClass();if(!cls)return;
            const selDates=Array.from(document.querySelectorAll('#analysisDateCheckGroup input:checked')).map(cb=>cb.value);
            const selCols=Array.from(document.querySelectorAll('#analysisColumnCheckGroup input:checked')).map(cb=>cb.value);

            const container=document.getElementById('lineChartsContainer');
            container.innerHTML=''; Object.values(lineChartInstances).forEach(inst=>inst.destroy()); for(const k in lineChartInstances)delete lineChartInstances[k];
            if(!studentName||!selDates.length||!selCols.length)return;
            const allDates=getDateList(cls.id).filter(d=>selDates.includes(d)).sort(naturalSort);

            // 预扫描：判定每列类型 — 完成列 / 等级列 / 得分列
            var colTypes={}; var colGradeMap={}; // gradeMap: {4:'优秀', 3:'良好', ...}
            selCols.forEach(function(colKeyword){
                var binC=0,gradeC=0,numC=0;
                var lvls={};
                allDates.forEach(function(dateLabel){
                    var entry=getEntry(cls.id,dateLabel);
                    var ci=entry?findColumnIndexAndMax(entry,colKeyword):{idx:-1};
                    if(ci.idx===-1)return;
                    var records=(Array.isArray(entry)?entry:entry.records)||[];
                    records.forEach(function(r){
                        var v=(r.values[ci.idx]||'').trim();
                        if(!v)return;
                        if(isBinaryMarker(v)){binC++;}
                        else if(isGradeValue(v)){
                            gradeC++;var lvl=gradeToNumber(v);
                            if(lvl!==null&&!(lvl in lvls))lvls[lvl]=v;
                        }else if(isGradedValue(v)||/^\d+(\.\d+)?$/.test(v)){numC++;}
                    });
                });
                if(binC>=gradeC&&binC>=numC)colTypes[colKeyword]='completion';
                else if(gradeC>=binC&&gradeC>=numC){colTypes[colKeyword]='grade';colGradeMap[colKeyword]=lvls;}
                else colTypes[colKeyword]='score';
            });

            function _closestGrade(val,gradeMap){
                var best=null,bestD=Infinity;
                for(var lv in gradeMap){var d=Math.abs(val-Number(lv));if(d<bestD){bestD=d;best=gradeMap[lv];}}
                return best||'';
            }

            selCols.forEach((colKeyword,idx)=>{
                var type=colTypes[colKeyword];
                var isComp=type==='completion',isGrade=type==='grade';
                var gradeMap=colGradeMap[colKeyword]||{};
                const studentData=[],avgData=[],studentRaw=[];
                allDates.forEach(dateLabel=>{
                    const entry=getEntry(cls.id,dateLabel);
                    const { idx:colIdx, maxScore } = entry ? findColumnIndexAndMax(entry, colKeyword) : { idx:-1, maxScore:0 };
                    if(colIdx===-1){studentData.push(null);avgData.push(null);studentRaw.push(null);return;}
                    const records=(Array.isArray(entry)?entry:entry.records)||[];
                    if(isComp){
                        var stuVal=null,doneC=0,totalC=0;
                        records.forEach(function(r){
                            var v=(r.values[colIdx]||'').trim();
                            if(!v||!isBinaryMarker(v))return;
                            totalC++;if(isBinaryDone(v))doneC++;
                            if(r.name===studentName)stuVal=isBinaryDone(v)?100:0;
                        });
                        studentData.push(stuVal);studentRaw.push(null);
                        avgData.push(totalC>0?Math.round(doneC/totalC*100):null);
                    }else if(isGrade){
                        var stuVal=null,rawLabel=null,sum=0,cnt=0;
                        records.forEach(function(r){
                            var v=(r.values[colIdx]||'').trim();
                            if(!v)return;var mapped=gradeToNumber(v);
                            if(mapped===null)return;
                            sum+=mapped;cnt++;
                            if(r.name===studentName){stuVal=mapped;rawLabel=v;}
                        });
                        studentData.push(stuVal);studentRaw.push(rawLabel);
                        avgData.push(cnt>0?Math.round(sum/cnt*100)/100:null);
                    }else{
                        var stuVal=null,sum=0,cnt=0;
                        records.forEach(function(r){
                            var v=r.values[colIdx];
                            if(v!==''&&v!==null&&v!==undefined){
                                var score=convertToNumber(v,maxScore);
                                if(score===null)return;
                                var pct=maxScore?Math.round((score/maxScore)*100):score;
                                sum+=pct;cnt++;if(r.name===studentName)stuVal=pct;
                            }
                        });
                        studentData.push(stuVal);studentRaw.push(null);
                        avgData.push(cnt>0?Math.round(sum/cnt):null);
                    }
                });
                var titleIcon=isComp?'📋 ':(isGrade?'🏷 ':'');
                var card=document.createElement('div');card.className='card';
                card.innerHTML='<div class="card-title">'+titleIcon+escapeHtml(colKeyword)+'</div><div style="height:200px;"><canvas id="lineCanvas'+idx+'" height="200"></canvas></div><div class="chart-desc" id="desc'+idx+'"></div>';
                container.appendChild(card);
                var canvas=document.getElementById('lineCanvas'+idx);var descDiv=document.getElementById('desc'+idx);
                var valid=studentData.filter(function(v){return v!==null;});var desc='';

                if(isComp){
                    if(valid.length>=1){
                        var doneCount=valid.filter(function(v){return v===100;}).length;
                        var total=valid.length;var stuPct=Math.round(doneCount/total*100);
                        var recent3=valid.slice(-3);var recentDone=recent3.filter(function(v){return v===100;}).length;
                        var half=Math.floor(valid.length/2)||1;
                        var firstHalf=valid.slice(0,half);var secondHalf=valid.slice(-half);
                        var fRate=firstHalf.filter(function(v){return v===100;}).length/firstHalf.length;
                        var sRate=secondHalf.filter(function(v){return v===100;}).length/secondHalf.length;
                        var diff=(sRate-fRate)*100;
                        var trend='';if(diff>20)trend='📈 进步明显';else if(diff<-20)trend='📉 有所下滑';else trend='📊 保持稳定';
                        var clsSum=0,clsCnt=0;avgData.forEach(function(v){if(v!==null){clsSum+=v;clsCnt++;}});
                        var clsAvg=clsCnt>0?Math.round(clsSum/clsCnt):0;
                        var vsAvg=clsAvg>0?(stuPct>clsAvg?'，高于班级平均（'+clsAvg+'%）':(stuPct<clsAvg?'，低于班级平均（'+clsAvg+'%）':'，与班级平均持平（'+clsAvg+'%）')):'';
                        desc=trend+'，'+total+'次课中完成'+doneCount+'次（'+stuPct+'%），近3次完成'+recentDone+'次'+vsAvg;
                    }else desc='数据不足';
                }else if(isGrade){
                    var rawVals=studentRaw.filter(function(v){return v!==null;});
                    if(rawVals.length>=2){
                        var firstRaw=rawVals[0],lastRaw=rawVals[rawVals.length-1];
                        var half=Math.floor(valid.length/2)||1;
                        var fAvg=valid.slice(0,half).reduce(function(a,b){return a+b;},0)/half;
                        var sAvg=valid.slice(-half).reduce(function(a,b){return a+b;},0)/(half||1);
                        var diff=sAvg-fAvg;
                        var trend='';if(diff>0.5)trend='📈 进步明显';else if(diff<-0.5)trend='📉 有所下滑';else trend='📊 保持稳定';
                        var recentRaw=rawVals.slice(-3);var recentSet={};recentRaw.forEach(function(v){recentSet[v]=true;});recentSet=Object.keys(recentSet);
                        var recentDesc=recentSet.length===1?'稳定在'+recentSet[0]:'在'+recentSet.join('到')+'之间波动';
                        var stuAvg=valid.reduce(function(a,b){return a+b;},0)/valid.length;
                        var clsSum=0,clsCnt=0;avgData.forEach(function(v){if(v!==null){clsSum+=v;clsCnt++;}});
                        var clsAvgVal=clsCnt>0?clsSum/clsCnt:0;
                        var clsAvgGrade=_closestGrade(clsAvgVal,gradeMap);
                        var vsAvg=clsAvgGrade?(stuAvg>clsAvgVal+0.3?'，高于班级平均（'+clsAvgGrade+'）':(stuAvg<clsAvgVal-0.3?'，低于班级平均（'+clsAvgGrade+'）':'，与班级平均持平（'+clsAvgGrade+'）')):'';
                        desc=trend+'，从'+firstRaw+'提升到'+lastRaw+'，近3次'+recentDesc+vsAvg;
                    }else desc='数据不足';
                }else{
                    if(valid.length>=2){
                        var first=valid[0],last=valid[valid.length-1];
                        var diff=last-first;var recent=valid.slice(-3);

                        var bestVal=-1,bestDate='',worstVal=101,worstDate='';
                        studentData.forEach(function(v,i){if(v!==null){if(v>bestVal){bestVal=v;bestDate=allDates[i];}if(v<worstVal){worstVal=v;worstDate=allDates[i];}}});
                        var clsSum=0,clsCnt=0;avgData.forEach(function(v){if(v!==null){clsSum+=v;clsCnt++;}});
                        var clsAvg=clsCnt>0?Math.round(clsSum/clsCnt):0;
                        var vsAvg=clsAvg>0?(avg>clsAvg?'，高于班级平均（'+clsAvg+'分）':(avg<clsAvg?'，低于班级平均（'+clsAvg+'分）':'，与班级平均持平（'+clsAvg+'分）')):'';
                        var trend='';if(diff>10)trend='📈 进步明显';else if(diff<-10)trend='📉 有所下滑';else trend='📊 保持稳定';
                        desc=trend+'，从'+first+'分→'+last+'分，最高'+bestDate+'（'+bestVal+'分），近3次平均'+avg+'分'+vsAvg;

                descDiv.textContent=desc;
                var studentColor=COLORS[idx%COLORS.length];

                // Y轴配置
                var yTitle, yMin, yMax, yTicks;
                if(isComp){yTitle='完成率（%）';yMin=0;yMax=100;yTicks={};}
                else if(isGrade){
                    yTitle='等级趋势';yMin=0;yMax=4;
                    yTicks={stepSize:1,callback:function(v){return gradeMap[v]||'';}};
                }else{yTitle='百分制得分';yMin=0;yMax=100;yTicks={};}

                var dataLabelPlugin={id:'ptLabel',afterDraw:function(chart){var ctx=chart.ctx;ctx.save();ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';chart.data.datasets.forEach(function(ds,dsi){if(ds.label!==studentName)return;var meta=chart.getDatasetMeta(dsi);meta.data.forEach(function(pt,i){var v=ds.data[i];if(v===null||v===undefined)return;ctx.fillStyle='#1e293b';if(isComp)ctx.fillText(v===100?'✓':'✗',pt.x,pt.y-6);else if(isGrade)ctx.fillText(studentRaw[i]||'',pt.x,pt.y-6);else ctx.fillText(String(v),pt.x,pt.y-6);});});ctx.restore();}};
                lineChartInstances[idx]=new Chart(canvas,{
                    type:'line',data:{labels:allDates,datasets:[{label:studentName,data:studentData,borderColor:studentColor,backgroundColor:studentColor,borderWidth:2.5,tension:0.2,pointRadius:4,pointStyle:'circle'},{label:'班级平均',data:avgData,borderColor:'#94a3b8',backgroundColor:'#94a3b8',borderWidth:2,borderDash:[5,5],tension:0.2,pointRadius:3,pointStyle:'triangle'}]},
                    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{min:yMin,max:yMax,title:{display:true,text:yTitle},ticks:yTicks}}},
                    plugins:[dataLabelPlugin]
                });
            });
        }

        // ========== AI 分析 ==========
        window.runAIAnalysis = async function() {
            const cls = getAnalysisClass(); if (!cls) return;
            const studentName = document.getElementById('analysisStudentSelect').value;
            if (!studentName) { await showConfirm('请选择学生'); return; }
            const radarDate = document.getElementById('radarDateSelect')?.value;
            if (!radarDate) { await showConfirm('请选择雷达图课次'); return; }
            const entry = getEntry(cls.id, radarDate); if (!entry) { await showConfirm('该课次无数据'); return; }
            const records = (Array.isArray(entry) ? entry : entry.records) || [];
            const studentRec = records.find(r => r.name === studentName);
            if (!studentRec) { await showConfirm('未找到该学生数据'); return; }
            const radarCols = Array.from(document.querySelectorAll('#radarColumnCheckGroup input:checked')).map(cb => cb.value);
            if (!radarCols.length) { await showConfirm('请勾选至少一个题型'); return; }

            let scoreDesc = `学生 ${studentName} 在 ${radarDate} 各题型表现如下：\n`;
            radarCols.forEach(keyword => {
                const { idx, maxScore } = findColumnIndexAndMax(entry, keyword);
                const val = idx !== -1 ? (studentRec.values[idx] || '') : '';
                scoreDesc += `- ${keyword}：得分${val}，满分${maxScore || '未知'}\n`;
            });

            const manualDesc = document.getElementById('examDescTextarea')?.value?.trim() || '';
            let fileContent = '';
            const fileInput = document.getElementById('examFileInput');
            if (fileInput && fileInput.files.length > 0) fileContent = await readFileContent(fileInput.files[0]);

            let fullDesc = scoreDesc;
            if (manualDesc) fullDesc += `\n【老师补充的试卷描述】\n${manualDesc}`;
            if (fileContent) fullDesc += `\n【上传的试卷内容】\n${fileContent}`;

            const systemPrompt = `你是一位有10年教学经验的英语老师，特别擅长根据学生的试卷表现，写出既专业又充满鼓励的个性化评语，语气像手写给学生的谈心笔记。请严格遵循以下格式：1. 逐题型点评学生表现，指出具体好在哪里、不足在哪里，语言亲切；2. 归纳学生最需要加强的两个知识点或能力点；3. 给出接下来一段时间具体可操作的学习建议。不要使用Markdown符号，直接输出纯文本。`;
            const userPrompt = fullDesc + '\n请根据以上信息，对学生进行全面分析。';

            document.getElementById('aiResult').innerHTML = '分析中，请稍候...';
            try {
                let resultText;
                let triedEdgeFunction = false;
                // 优先使用 Supabase Edge Function（无需 API Key）
                try {
                    const { data, error } = await supabase.functions.invoke('ai-analyze', {
                        body: {
                            student_name: studentName,
                            class_name: cls.name,
                            date: radarDate,
                            score_desc: scoreDesc,
                            manual_desc: manualDesc,
                            file_content: fileContent,
                            system_prompt: systemPrompt,
                            user_prompt: userPrompt
                        }
                    });
                    triedEdgeFunction = true;
                    if (!error && data && data.result) {
                        resultText = data.result;
                    } else if (data && data.error) {
                        throw new Error('Edge Function 错误：' + data.error);
                    } else {
                        throw new Error(error?.message || 'Edge Function 返回空');
                    }
                } catch (efErr) {
                    // Edge Function 失败，尝试用 API Key 直连 DeepSeek
                    const apiKey = document.getElementById('apiKeyInput')?.value?.trim();
                    if (!apiKey) throw new Error('请先输入 DeepSeek API Key');
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }], temperature: 0.7, max_tokens: 1000 })
                    });
                    const data = await response.json();
                    resultText = data.choices?.[0]?.message?.content;
                    if (!resultText) throw new Error('DeepSeek 请求失败：' + (data.error?.message || JSON.stringify(data)));
                }
                resultText = (resultText || '').replace(/[#*_`>]/g, '');
                document.getElementById('aiResult').innerHTML = resultText.replace(/\n/g, '<br>');
            } catch (err) { document.getElementById('aiResult').innerHTML = '请求失败：' + err.message; }
        };

        async function readFileContent(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
                    reader.onload = e => resolve(e.target.result); reader.readAsText(file);
                } else if (file.name.endsWith('.docx')) {
                    reader.onload = e => mammoth.extractRawText({ arrayBuffer: e.target.result }).then(r => resolve(r.value)).catch(() => resolve('无法解析 docx 文件'));
                    reader.readAsArrayBuffer(file);
                } else if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                    reader.onload = e => {
                        const pdfjsLib = window['pdfjs-dist/build/pdf'];
                        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise.then(async pdf => {
                            let text = ''; for (let i = 1; i <= pdf.numPages; i++) { const page = await pdf.getPage(i); const content = await page.getTextContent(); text += content.items.map(item => item.str).join(' ') + '\n'; }
                            resolve(text);
                        }).catch(() => resolve('无法解析 PDF 文件'));
                    };
                    reader.readAsArrayBuffer(file);
                } else resolve('不支持的文件类型');
            });
        }

        // ========== PDF 导出（智能分页 + 页码） ==========
        window.downloadPDFReport = async function() {
            if (!window.jspdf || !window.html2canvas) { showConfirm('PDF库未加载，请刷新'); return; }
            const titleEl = document.getElementById('analysisReportTitle');
            const fileName = (titleEl?.textContent || '学习分析报告') + '.pdf';
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 10, imgWidth = pageWidth - margin*2;
            let currentY = margin;

            if (titleEl) {
                var titleCanvas = await html2canvas(titleEl, { scale: 2, backgroundColor: '#ffffff' });
                var titleImg = titleCanvas.toDataURL('image/png');
                var titleHeight = (titleCanvas.height * imgWidth) / titleCanvas.width;
                if (currentY + titleHeight > pageHeight - margin - 8) { pdf.addPage(); currentY = margin; }
                pdf.addImage(titleImg, 'PNG', margin, currentY, imgWidth, titleHeight);
                currentY += titleHeight + 6;
            }

            var lineCards = document.querySelectorAll('#lineChartsContainer > .card');
            for (var i = 0; i < lineCards.length; i++) {
                var cardCanvas = await html2canvas(lineCards[i], { scale: 2, backgroundColor: '#ffffff' });
                var cardImg = cardCanvas.toDataURL('image/png');
                var cardHeight = (cardCanvas.height * imgWidth) / cardCanvas.width;
                if (currentY + cardHeight > pageHeight - margin - 8) { pdf.addPage(); currentY = margin; }
                pdf.addImage(cardImg, 'PNG', margin, currentY, imgWidth, cardHeight);
                currentY += cardHeight + 4;
            }

            var radarSection = document.getElementById('radarSection');
            if (radarSection) {
                var radarCanvas = await html2canvas(radarSection, { scale: 2, backgroundColor: '#ffffff' });
                var radarImg = radarCanvas.toDataURL('image/png');
                var radarHeight = (radarCanvas.height * imgWidth) / radarCanvas.width;
                if (currentY + radarHeight > pageHeight - margin - 8) { pdf.addPage(); currentY = margin; }
                pdf.addImage(radarImg, 'PNG', margin, currentY, imgWidth, radarHeight);
                currentY += radarHeight + 4;
            }

            var aiEl = document.getElementById('aiResult');
            if (aiEl && aiEl.innerText.trim() && aiEl.innerText.trim() !== '分析中...') {
                var aiCanvas = await html2canvas(aiEl, { scale: 2, backgroundColor: '#ffffff' });
                var aiImg = aiCanvas.toDataURL('image/png');
                var aiHeight = (aiCanvas.height * imgWidth) / aiCanvas.width;
                if (currentY + aiHeight > pageHeight - margin - 8) { pdf.addPage(); currentY = margin; }
                pdf.addImage(aiImg, 'PNG', margin, currentY, imgWidth, aiHeight);
            }

            // 给所有页加页码
            var totalPages = pdf.getNumberOfPages();
            for (var p = 1; p <= totalPages; p++) {
                pdf.setPage(p);
                pdf.setFontSize(8);
                pdf.setTextColor(160, 160, 160);
                pdf.text(p + '/' + totalPages, pageWidth / 2, pageHeight - 6, { align: 'center' });
            }

            pdf.save(fileName);
        };

        // ========== 拖拽（修复点击打开） ==========
        window.startDragFloat = function(e) {
            if (e.target.matches('button, span, input, textarea, select')) return;
            isDraggingFloat = true; const btn = document.getElementById('floatBtn');
            dragStartX = e.touches ? e.touches[0].clientX : e.clientX;
            dragStartY = e.touches ? e.touches[0].clientY : e.clientY;
            startLeft = parseInt(btn.style.left) || floatBtnLeft;
            startTop = parseInt(btn.style.top) || floatBtnTop;
            btn.style.transition = 'none';
            e.preventDefault();
        };
        window.startDragPopup = function(e) {
            if (e.target.matches('button, span, input, textarea, select')) return;
            isDraggingPopup = true; const popup = document.getElementById('toolPopup');
            dragStartX = e.touches ? e.touches[0].clientX : e.clientX;
            dragStartY = e.touches ? e.touches[0].clientY : e.clientY;
            popupStartLeft = parseInt(popup.style.left) || popup.getBoundingClientRect().left;
            popupStartTop = parseInt(popup.style.top) || popup.getBoundingClientRect().top;
            popup.style.transition = 'none';
            e.preventDefault();
        };
        window.addEventListener('mousemove', function(e) {
            if (isDraggingFloat) { const btn = document.getElementById('floatBtn'); btn.style.left = (startLeft + e.clientX - dragStartX) + 'px'; btn.style.top = (startTop + e.clientY - dragStartY) + 'px'; }
            if (isDraggingPopup) { const popup = document.getElementById('toolPopup'); popup.style.left = (popupStartLeft + e.clientX - dragStartX) + 'px'; popup.style.top = (popupStartTop + e.clientY - dragStartY) + 'px'; }
        });
        window.addEventListener('touchmove', function(e) {
            if (isDraggingFloat) { const btn = document.getElementById('floatBtn'); btn.style.left = (startLeft + e.touches[0].clientX - dragStartX) + 'px'; btn.style.top = (startTop + e.touches[0].clientY - dragStartY) + 'px'; }
            if (isDraggingPopup) { const popup = document.getElementById('toolPopup'); popup.style.left = (popupStartLeft + e.touches[0].clientX - dragStartX) + 'px'; popup.style.top = (popupStartTop + e.touches[0].clientY - dragStartY) + 'px'; }
        }, { passive: false });
        window.addEventListener('mouseup', (e) => {
            if (isDraggingFloat) {
                const dx = Math.abs(e.clientX - dragStartX); const dy = Math.abs(e.clientY - dragStartY);
                if (dx < 5 && dy < 5) togglePopup();
                floatBtnLeft = parseInt(document.getElementById('floatBtn').style.left) || floatBtnLeft;
                floatBtnTop = parseInt(document.getElementById('floatBtn').style.top) || floatBtnTop;
            }
            isDraggingFloat = false; isDraggingPopup = false;
        });
        window.addEventListener('touchend', (e) => {
            if (isDraggingFloat) {
                const touch = e.changedTouches[0]; const dx = Math.abs(touch.clientX - dragStartX); const dy = Math.abs(touch.clientY - dragStartY);
                if (dx < 5 && dy < 5) togglePopup();
                floatBtnLeft = parseInt(document.getElementById('floatBtn').style.left) || floatBtnLeft;
                floatBtnTop = parseInt(document.getElementById('floatBtn').style.top) || floatBtnTop;
            }
            isDraggingFloat = false; isDraggingPopup = false;
        });

        window.settingsSave = async function(){
            var newName = document.getElementById('settingsNameInput')?.value?.trim() || '';
            var newGender = _settingsEditGender;
            var newDistrict = document.getElementById('settingsDistrict')?.value || '';
            var oldName = _userName || '';

            // 改名
            if (newName && newName !== oldName) {
                var { data: exist } = await supabase.from('teacher_profiles').select('name').eq('name', newName).maybeSingle();
                if (exist) { await showConfirm('该姓名已被使用'); return; }
                var { data: { session } } = await supabase.auth.getSession();
                var currentEmail = (session && session.user) ? session.user.email : '';
                if (currentEmail) {
                    try { localStorage.setItem('_fb_name_email_' + newName, currentEmail); } catch(e) {}
                }
                var patchResp = await fetch(SUPABASE_URL + '/rest/v1/teacher_profiles?user_id=eq.' + encodeURIComponent(_userId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + session.access_token, 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ name: newName })
                });
                if (!patchResp.ok) { var patchErr = await patchResp.json().catch(function(){return {};}); await showConfirm('改名失败：'+ (patchErr.message || patchResp.status)); return; }
                _userName = newName;
            }

            // 保存性别和大区（用 REST API 直接 PATCH）
            if (newGender !== currentGender || newDistrict !== currentDistrict) {
                if (newGender !== currentGender) currentGender = newGender;
                if (newDistrict !== currentDistrict) currentDistrict = newDistrict;

                    if (ss) {
                        await fetch(SUPABASE_URL + '/rest/v1/teacher_profiles?user_id=eq.' + encodeURIComponent(_userId), {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + ss.access_token, 'Prefer': 'return=minimal' },
                            body: JSON.stringify({ gender: currentGender || null, district: currentDistrict || null })
                        });
                    }
                } catch(e) { console.warn('save settings failed:', e.message); }
            }

            // 更新头部
            var prefix = (currentGender==='male'?GENDER_ICON_MALE+' ':'')+(currentGender==='female'?GENDER_ICON_FEMALE+' ':'');

            // 还原 UI

            document.getElementById('settingsGenderEdit').style.display='none';
            document.getElementById('settingsDistrictView').style.display='';
            document.getElementById('settingsDistrict').style.display='none';
            document.getElementById('settingsActionsView').style.display='flex';
            document.getElementById('settingsActionsEdit').style.display='none';
            var nameRow=document.getElementById('settingsNameRow');
            nameRow.innerHTML='<span id="settingsNameDisplay">'+escapeHtml(_userName||'未设置')+'</span>';
            refreshSettingsUI();
            await showConfirm('✅ 设置已保存');
        }
