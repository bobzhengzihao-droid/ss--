<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>班级每日反馈表 · 汇总分析</title>
    <link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://html2canvas.hertzen.com" crossorigin>
    <link rel="dns-prefetch" href="https://furpcqytmgxqkxlbselj.supabase.co">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://unpkg.com/mammoth@1.7.0/mammoth.browser.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="style.css?v=f4f60aff">
</head>
<body>
    <!-- 登录浮层 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h2>📒 班级反馈表</h2>
            <div class="login-tabs">
                <button class="login-tab active" id="tabLogin" onclick="switchLoginTab('login')">登 录</button>
                <button class="login-tab" id="tabRegister" onclick="switchLoginTab('register')">注 册</button>
            </div>
            <input class="login-input" id="loginName" placeholder="姓名或邮箱" autocomplete="username">
            <input class="login-input" id="loginPassword" type="password" placeholder="密码" autocomplete="current-password">
            <div id="regExtra" style="display:none;">
                <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
                    <span style="font-size:12px;color:var(--text-muted);">性别：</span>
                    <input type="hidden" id="regGenderValue" value="">
                    <div id="regGenderMale" onclick="regPickGender('male')" style="display:flex;align-items:center;gap:4px;padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;font-size:13px;user-select:none;"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0"><circle cx="10" cy="12" r="5"/><path d="M14 8l7-7"/><polyline points="17 1 21 1 21 5"/></svg>男</div>
                    <div id="regGenderFemale" onclick="regPickGender('female')" style="display:flex;align-items:center;gap:4px;padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;font-size:13px;user-select:none;"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0"><circle cx="12" cy="9" r="5"/><line x1="12" y1="14" x2="12" y2="20"/><line x1="9" y1="17" x2="15" y2="17"/></svg>女</div>
                </div>
                <select class="login-input" id="regDistrict" style="margin-bottom:8px;"><option value="">请选择大区</option><option value="东一区">东一区</option><option value="东二区">东二区</option><option value="西一区">西一区</option><option value="西二区">西二区</option><option value="南一区">南一区</option><option value="南二区">南二区</option><option value="武侯区">武侯区</option></select>
            </div>
            <input class="login-input" id="regCode" type="text" placeholder="注册码" style="display:none;">
            <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>
            <div class="login-msg" id="loginMsg"></div>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="mainApp" class="app-only">
    <div class="container" id="app">
        <div class="header">
            <div class="class-selector"><span>🏫</span><span class="class-name-display" id="currentClassName" onclick="switchView('classes')">未选择</span></div>
            <span id="headerUserName" onclick="switchView('settings')" style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;cursor:pointer;" title="个人设置"></span>
            <button class="btn btn-xs btn-outline" onclick="exportAllData()">💾 备份</button>
            <button class="btn btn-xs btn-outline" onclick="importAllDataPrompt()">📥 导入</button>
        </div>
        <div id="view-classes" class="view"></div>
        <div id="view-feedback" class="view" style="display:none;"></div>
        <div id="view-communication" class="view" style="display:none;"></div>
        <div id="view-fulltable" class="view" style="display:none;"></div>
        <div id="view-analysis" class="view" style="display:none;"></div>
        <div id="view-settings" class="view" style="display:none;"></div>
    </div><!-- /.container -->
    </div><!-- /#mainApp -->

    <div class="float-btn app-only" id="floatBtn" onmousedown="startDragFloat(event)" ontouchstart="startDragFloat(event)">⚡</div>
    <div class="tool-popup app-only" id="toolPopup" onmousedown="startDragPopup(event)" ontouchstart="startDragPopup(event)">
        <div class="popup-header"><span>快捷工具</span><button class="close-popup" onclick="closePopup()">✕</button></div>
        <div id="toolItems" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
        <div class="tool-edit-panel" id="toolEditPanel"></div>
        <div><button class="btn btn-xs" id="btnSaveTools" style="display:none;" onclick="saveToolChanges()">💾 保存</button></div>
        <div class="popup-footer">
            <button class="popup-action-btn" onclick="openToolEditor()">⚙️ 编辑</button>
            <button class="popup-action-btn" onclick="quickFill('清空')">🗑️ 清空</button>
        </div>
    </div>
    <div class="nav-tabs app-only">
        <button class="nav-tab" data-view="classes" onclick="switchView('classes')">🏫 班级</button>
        <button class="nav-tab" data-view="feedback" onclick="switchView('feedback')">✏️ 反馈</button>
        <button class="nav-tab" data-view="fulltable" onclick="switchToFullTable()">📋 总表</button>
        <button class="nav-tab" data-view="communication" onclick="switchView('communication')">💬 沟通</button>
        <button class="nav-tab" data-view="analysis" onclick="switchView('analysis')">📈 分析</button>
    </div>

    <script src="app.js?v=f4f60aff"></script>
</body>
</html>
